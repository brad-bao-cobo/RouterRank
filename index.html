        {r.status === 'failed' && (
          <div className="text-coral text-[12px]">
            <I.x className="w-3.5 h-3.5 inline mr-1"/>
            {t('run.failedPrefix')}{r.error}
          </div>
        )}
        {r.status === 'completed' && (
          // While streaming, render as plain sans-serif (matches post-stream
          // markdown body) so the typeface doesn't jump when stream.done flips.
          // Once done, switch to MarkdownBody for proper markdown / code blocks.
          stream.done
            ? <MarkdownBody text={stream.shown}/>
            : (
              <div className="whitespace-pre-wrap text-[12.5px] leading-[1.55] text-bone">
                {stream.shown}
                <span className="inline-block w-1.5 h-3.5 bg-brand ml-0.5 align-middle pulse-dot"></span>
              </div>
            )
        )}
      </div>

      {/* Footer — metrics + thumbs/copy/retry */}
      <div className="mt-2 pt-3 border-t border-ink-600 flex items-center justify-between gap-2 flex-wrap">
        <div className="flex items-center gap-3 text-[11px] num text-ash overflow-x-auto no-scroll-x">
          {r.ttft != null && <span title={t('run.colTtft')}>{(r.ttft * 1000) | 0}ms</span>}
          {r.latency != null && <span title={t('run.colLatency')}>{r.latency.toFixed(2)}s</span>}
          {r.cost != null && <span title={t('run.colCost')}>{fmtUSD(r.cost, 4)}</span>}
          {r.outputTokens != null && <span title={t('run.colTokens')}>{r.inputTokens}/{r.outputTokens}</span>}
        </div>
        <div className="flex items-center gap-1">
          {r.status === 'completed' && (
            <Fragment>
              <button
                onClick={() => onThumb(turnId, r.slug, 'up')}
                title={t('run.thumbUpTip')}
                className={cx('p-1.5 transition-colors', r.thumb === 'up' ? 'text-brand' : 'text-smoke hover:text-bone')}
              >
                <I.thumbsUp className="w-3.5 h-3.5"/>
              </button>
              <button
                onClick={() => onThumb(turnId, r.slug, 'down')}
                title={t('run.thumbDownTip')}
                className={cx('p-1.5 transition-colors', r.thumb === 'down' ? 'text-coral' : 'text-smoke hover:text-bone')}
              >
                <I.thumbsDown className="w-3.5 h-3.5"/>
              </button>
              <button onClick={onCopy} title={t('run.copyResponse')} className="text-smoke hover:text-bone p-1.5 transition-colors">
                <I.copy className="w-3.5 h-3.5"/>
              </button>
            </Fragment>
          )}
          {r.status === 'failed' && (
            <button
              onClick={() => onRetry(turnId, r.slug)}
              title={t('run.retryThis')}
              className="px-2 py-1 text-[11px] border border-ink-600 hover:border-bone/40 text-ash hover:text-bone inline-flex items-center gap-1 transition-colors"
            >
              <I.refresh className="w-3 h-3"/> {t('run.retry')}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ComposeBox — single unified bordered container. Textarea fills the space;
// the action button at bottom-right swaps Send ↔ Stop based on `inFlight`.
// Cmd/Ctrl+Enter submits when not in flight.
function ComposeBox({ value, onChange, onSubmit, onStop, inFlight, disabled, disabledReason, inputRef, providerCount }) {
  const { t } = useLang();
  const localRef = useRef(null);
  const textareaRef = inputRef || localRef;

  useEffect(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 240) + 'px';
  }, [value]);

  const onKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      if (!inFlight) onSubmit();
    }
  };

  const placeholder = t('run.composePlaceholder', {
    n: providerCount,
    s: providerCount === 1 ? '' : 's',
  });

  const canSend = !disabled && !inFlight && value.trim().length > 0;
  // Textarea stays editable during inFlight so the user can prep their next
  // message while waiting — only the Send action is replaced by Stop.

  return (
    <div>
      <div className={cx(
        'relative bg-ink-800 border transition-colors',
        disabled ? 'border-ink-600' : 'border-ink-500 focus-within:border-brand/60'
      )}>
        <textarea
          ref={textareaRef}
          value={value}
          onChange={e => onChange(e.target.value)}
          onKeyDown={onKeyDown}
          rows={4}
          placeholder={placeholder}
          disabled={disabled}
          className="w-full bg-transparent outline-none px-4 py-3 pr-16 text-[13px] resize-none text-bone leading-relaxed disabled:opacity-50 disabled:cursor-not-allowed"
          style={{ minHeight: 108, maxHeight: 240 }}
        />
        {inFlight ? (
          <button
            onClick={onStop}
            aria-label={t('run.composeStop')}
            title={t('run.composeStop')}
            className="absolute bottom-2 right-2 w-9 h-9 flex items-center justify-center bg-coral text-ink transition-colors hover:opacity-90"
          >
            <span className="w-3 h-3 bg-ink block"></span>
          </button>
        ) : (
          <button
            onClick={onSubmit}
            disabled={!canSend}
            aria-label={t('run.composeSend')}
            className={cx(
              'absolute bottom-2 right-2 w-9 h-9 flex items-center justify-center transition-colors',
              canSend
                ? 'btn-brand'
                : 'bg-ink-700 text-smoke cursor-not-allowed'
            )}
          >
            <I.send className="w-4 h-4"/>
          </button>
        )}
      </div>
      <div className="mt-1.5 px-0.5 min-h-[14px] flex items-center justify-between gap-2">
        <span className="micro text-smoke">
          {disabledReason
            || (inFlight ? t('run.composeInFlightHint') : t('run.composeHotkeyHint'))}
        </span>
      </div>
    </div>
  );
}

// Compute structured pricing entries for a provider: each row is a (model,
// official, listed, observed) tuple plus derived markup / drift percentages.
function providerCostEntries(p) {
  return MODELS
    .filter(m => p.modelPricing[m.id])
    .map(m => {
      const mp = p.modelPricing[m.id];
      const refIn  = m.officialIn;
      const refOut = m.officialOut;
      const listedBlended   = (mp.listedIn   + mp.listedOut)   / 2;
      const observedBlended = (mp.observedIn + mp.observedOut) / 2;
      const refBlended      = (refIn         + refOut)         / 2;
      const markupVsOfficial = refBlended > 0 ? ((listedBlended - refBlended) / refBlended) * 100 : 0;
      const driftVsListed    = listedBlended > 0 ? ((observedBlended - listedBlended) / listedBlended) * 100 : 0;
      return { m, mp, refIn, refOut, listedBlended, observedBlended, refBlended, markupVsOfficial, driftVsListed };
    });
}

// Per-call cost estimator with model dropdown + at-scale linear projection.
// Reads model selection from local state so user can switch within the card.
function PerCallEstimator({ entries, initialSelectedId }) {
  const { t } = useLang();
  // Initial selection follows the page-level model context if provided
  const [selectedId, setSelectedId] = useState(
    initialSelectedId && entries.some(e => e.m.id === initialSelectedId)
      ? initialSelectedId
      : entries[0]?.m.id
  );
  // Sync when the page-level model changes (user switches model in ModelContextBar)
  useEffect(() => {
    if (initialSelectedId && entries.some(e => e.m.id === initialSelectedId) && initialSelectedId !== selectedId) {
      setSelectedId(initialSelectedId);
    }
  }, [initialSelectedId]); // eslint-disable-line react-hooks/exhaustive-deps
  const sel = entries.find(e => e.m.id === selectedId) || entries[0];
  if (!sel) return null;

  // Typical chat completion: 250 in + 750 out tokens (1:3 ratio)
  const inTok = 250, outTok = 750;
  const observedReq = (inTok * sel.mp.observedIn + outTok * sel.mp.observedOut) / 1e6;
  const refReq      = (inTok * sel.refIn         + outTok * sel.refOut)         / 1e6;
  const perCallDelta = observedReq - refReq;
  const cheaper = perCallDelta < 0;
  const matched = Math.abs(perCallDelta) < 1e-7;
  const tone = matched ? 'text-smoke' : cheaper ? 'text-brand' : 'text-coral';

  const tiers = [100, 1000, 10000, 100000];

  return (
    <div className="card p-6 space-y-6">
      {/* Header: cost analyzer title + typical chat subtitle + model picker */}
      <div className="flex items-baseline justify-between gap-3 flex-wrap pb-4 border-b border-ink-600">
        <div>
          <h4 className="serif text-xl tracking-editorial">{t('provider.costAnalyzerTitle')}</h4>
          <div className="micro text-smoke mt-1.5">{t('provider.perTypicalChat', { inTok, outTok })}</div>
        </div>
        <Dropdown
          label={t('provider.selectModel')}
          value={sel.m.display}
          options={entries.map(e => ({ v: e.m.id, l: e.m.display }))}
          onChange={setSelectedId}
        />
      </div>

      {/* Two-cell comparison: official (reference) → observed (highlighted) */}
      {/* Clean 2-cell comparison — no bg tint on observed (was too muddy).
          Visual hierarchy: official is smoke (subdued) vs observed which is
          bone + font-medium + larger. Amber label only on header. */}
      <div className="grid grid-cols-2 gap-px bg-ink-600 border border-ink-600">
        <div className="bg-ink px-4 py-4">
          <div className="micro text-smoke mb-1.5">{t('provider.officialPrice')}</div>
          <div className="num text-[20px] text-smoke tracking-tight">{fmtUSD(refReq, 4)}</div>
        </div>
        <div className="bg-ink px-4 py-4">
          <div className="micro text-amber mb-1.5 flex items-center gap-1.5">
            {t('provider.observedShort')}
          </div>
          <div className="num text-[20px] text-bone font-medium tracking-tight">{fmtUSD(observedReq, 4)}</div>
        </div>
      </div>

      {/* At scale */}
      {!matched && (
        <div className="pt-4 border-t border-ink-600">
          <div className="micro text-smoke mb-3">{cheaper ? t('provider.atScaleSavings') : t('provider.atScalePremium')}</div>
          <div>
            {tiers.map(n => {
              const daily = Math.abs(perCallDelta) * n;
              return (
                <div key={n} className="flex items-baseline justify-between text-[12px] py-2 border-b border-ink-600 last:border-0">
                  <span className="num text-ash">{t('provider.callsPerDay', { n: n.toLocaleString() })}</span>
                  <span className={cx('num', tone)}>
                    {cheaper ? '−' : '+'}{fmtUSD(daily)}{t('provider.perDay')}
                  </span>
                </div>
              );
            })}
          </div>
          <div className="mt-3 pt-3 border-t border-ink-600 text-[11px] text-smoke leading-relaxed">
            {(cheaper
              ? t('provider.annualizedSaved', { amt: '__AMT__' })
              : t('provider.annualizedExtra', { amt: '__AMT__' })
            ).split('__AMT__').map((part, i, arr) => (
              <Fragment key={i}>
                {part}
                {i < arr.length - 1 && (
                  <span className={cx('num', tone)}>
                    {cheaper ? '−' : '+'}{fmtMoney(Math.abs(perCallDelta) * 10000 * 365, 0)}
                  </span>
                )}
              </Fragment>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Sticky scorecard sidebar — page-level reading anchor for the SELECTED
// model context. Title shows "{Provider} × {Model}" so the user always knows
// what the score is FOR. Scores come from `m` (per-model derivation).
function ScoreSidebar({ p, m, model }) {
  const { t } = useLang();
  if (!m) return null;
  const modelDisplay = MODELS.find(x => x.id === model)?.display || model;
  // Incidents filtered to those affecting the current model (sub-counts and total)
  const relevantIncidents = (p.incidents || []).filter(inc => (inc.affectedModels || []).includes(model));
  const dimCounts = relevantIncidents.reduce((acc, inc) => {
    const fam = (inc.dim || '').slice(0, 2);
    if (fam) acc[fam] = (acc[fam] || 0) + 1;
    return acc;
  }, {});
  const totalEvents = relevantIncidents.length;

  // Sub-dimension scores stay platform-level (we don't have per-model sub-dim
  // data). Tier-level scores come from m (model-aware). This is the honest
  // mix: aggregate score is model-specific, internal weights are platform.
  const tiers = [
    { key: 'L1', label: t('provider.l1Label'), score: m.L1, w: 40, text: 'text-brand', bar: 'bg-brand',
      subs: [
        { id: '1.1', name: t('provider.sub11'), value: p.scores.L1.modelAuth,    w: 50 },
        { id: '1.2', name: t('provider.sub12'), value: p.scores.L1.billingTrans, w: 30 },
        { id: '1.3', name: t('provider.sub13'), value: p.scores.L1.cacheFraud,   w: 20 },
      ],
    },
    { key: 'L3', label: t('provider.l3Label'), score: m.L3, w: 40, text: 'text-amber', bar: 'bg-amber',
      subs: [
        { id: '3.1', name: t('provider.sub31'), value: p.scores.L3.listPricing,        w: 35 },
        { id: '3.2', name: t('provider.sub32'), value: p.scores.L3.relativeToOfficial, w: 40 },
        { id: '3.3', name: t('provider.sub33'), value: p.scores.L3.hiddenCost,         w: 25 },
      ],
    },
    { key: 'L2', label: t('provider.l2Label'), score: m.L2, w: 20, text: 'text-sky', bar: 'bg-sky',
      subs: [
        { id: '2.1', name: t('provider.sub21'), value: p.scores.L2.latency,     w: 50 },
        { id: '2.2', name: t('provider.sub22'), value: p.scores.L2.throughput,  w: 30 },
        { id: '2.3', name: t('provider.sub23'), value: p.scores.L2.longContext, w: 20 },
      ],
    },
  ];

  return (
    <aside className="lg:sticky lg:top-20 self-start">
      <div className="card-2 ring-1 ring-brand/25 relative overflow-hidden">
        <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-brand to-transparent"/>
        <div className="p-6">
          {/* Headline: "{Provider} × {Model}" so context is crystal clear */}
          <div className="micro text-smoke mb-1">{t('provider.sidebarScoreLabel')}</div>
          <div className="text-[11px] text-ash mb-3 truncate" title={`${p.name} × ${modelDisplay}`}>
            <span className="text-bone">{p.name}</span> × <span className="text-bone">{modelDisplay}</span>

          <div className="flex items-baseline gap-3 flex-wrap">
            <span className="serif text-[52px] leading-none tracking-editorial text-bone num">{m.overall}</span>
            <span className="micro text-smoke num">/ 100</span>
            <TierChip tier={m.tier} size="lg"/>

          <div className="mt-4 h-1.5 bg-ink-700 overflow-hidden relative">
            <div
              className="absolute inset-y-0 left-0 bg-brand transition-all"
              style={{ width: `${m.overall}%` }}
              title={`${m.overall} / 100`}
            />
          </div>

          {/* Tier rows · collapsible, all closed by default */}
          <div className="mt-6 pt-5 border-t border-ink-600 space-y-px bg-ink-600">
            {tiers.map(g => (
              <details key={g.key} className="bg-ink group">
                <summary className="py-2.5 px-3 flex items-center gap-2 cursor-pointer hover:bg-ink-700 transition-colors">
                  <span className="text-smoke text-[9px] num group-open:rotate-90 transition-transform inline-block w-2 shrink-0">▶</span>

                </summary>

                  {g.subs.map(s => (
                    <div key={s.id} className="px-3 py-2 flex items-center gap-2 text-[11px]">

              {t('provider.methodology')} <I.arrow className="w-3 h-3"/>
            </a>
          </div>
        </div>
      </div>
    </aside>
  );
}

}

// PerformanceSection — §02 (L2) · all metrics are model-aware. Uses `m` from
// getModelMetrics() (per-model deterministic fake) instead of p's platform
// aggregates, so when the user switches model in ModelContextBar the entire
// section's numbers shift (slightly but visibly) to reflect that combination.
function PerformanceSection({ p, m, model }) {
  const { t } = useLang();
  if (!m) return null;
  const ttftP50 = m.ttft;
  // p95 derived from p50 with model-specific deterministic jitter
  const ttftP95 = +(ttftP50 * (1.85 + (strHash(p.slug + model + 'p95ttft') % 25) / 100)).toFixed(3);
  const fmtMs = (s) => `${(s * 1000) | 0}ms`;
  const modelDisplay = MODELS.find(x => x.id === model)?.display || model;

  // Throughput (single-request output token rate). Derived from the existing
  // latency/ttft/sample data via: output_tokens / (latency - ttft). Falls back
  // to a sensible lower bound if generation window is suspiciously short.
  // Anchored on a per-provider base rate (PROVIDER_TPS_BASE if defined) with
  // model-specific jitter so same (provider, model) is stable.
  const tps = useMemo(() => {
    // Use the platform's avg output tokens per request as the numerator
    const avgOut = 400 + (strHash(p.slug + model + 'out') % 220); // 400-620 toks
    const genWindow = Math.max(0.4, m.latency - m.ttft);
    const raw = avgOut / genWindow;
    // Clamp into plausible range based on provider type. Inference shops are
    // typically much faster than aggregators (Together/Fireworks ~150-400,
    // Groq-like 500+, OpenAI gateway ~25-45).
    const isInference = p.type === 'inference';
    const isSelfHost  = p.type === 'self_host';
    const lo = isInference ? 80 : isSelfHost ? 30 : 25;
    const hi = isInference ? 380 : isSelfHost ? 90 : 70;
    return Math.round(Math.max(lo, Math.min(hi, raw)));
  }, [p.slug, model, m.latency, m.ttft, p.type]);

  const regions = useMemo(() => {
    const base = ttftP50;
    const seed = (k) => strHash(p.slug + model + k) % 100;
    const reg = (p.region || '').toLowerCase();
    const homeBase = (homeKey) => reg.includes(homeKey) ? 1 : 1.4 + seed(homeKey) / 250;
    const globalish = reg.includes('global') || reg.includes('self') || reg.includes('asia');
    return [
      { name: 'US',   ttft: +(base * homeBase('us')).toFixed(3) },
      { name: 'EU',   ttft: +(base * homeBase('eu')).toFixed(3) },
      { name: 'Asia', ttft: +(base * (globalish ? 1.1 : 1.7 + seed('asia') / 250)).toFixed(3) },
    ];
  }, [p.slug, model, ttftP50, p.region]);
  const maxRegional = Math.max(...regions.map(r => r.ttft));

  // 7d TTFT trend — model-aware jitter applied to p.spark shape
  const ttftSpark = useMemo(() => {
    if (!p.spark || !p.spark.length) return [];
    const recent = p.spark.slice(-7);
    const seed = (k) => strHash(p.slug + model + k) % 100;
    return recent.map((v, i) => +(ttftP50 * (0.88 + (v / 10) * 0.20) * (0.95 + (seed('d' + i) / 100) * 0.10)).toFixed(3));
  }, [p.slug, model, p.spark, ttftP50]);

  const tone = (val, ok, warn) => val <= ok ? 'text-brand' : val <= warn ? 'text-amber' : 'text-coral';
  const successTone = m.success >= 0.99 ? 'text-brand' : m.success >= 0.97 ? 'text-bone' : 'text-amber';

  return (
    <section>
      <div className="micro text-smoke mb-3">{t('provider.tagPerformance')}</div>
      <h3 className="serif text-3xl tracking-editorial">
        {t('provider.headPerformance')}
        <span className="text-ash"> · {modelDisplay}</span>
      </h3>
      <p className="mt-2 text-[13px] text-ash leading-relaxed">
        {t('provider.perfSummaryModel', { samples: m.samples.toLocaleString(), model: modelDisplay })}
      </p>

      {/* 4 metric tiles: p50 TTFT / p95 TTFT / Throughput (tok/s) / Success.
          P99 dropped (too noisy in fake data); throughput promoted from
          placeholder card to a first-class metric — it's directly user-felt
          and derivable from existing TTFT/latency data. */}
      <div className="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-px bg-ink-600 border border-ink-600">
        <PerfMetric label={t('provider.perfP50')}        hint={t('provider.perfP50Hint')}        value={fmtMs(ttftP50)}       tone={tone(ttftP50, 0.30, 0.50)}/>
        <PerfMetric label={t('provider.perfP95')}        hint={t('provider.perfP95Hint')}        value={fmtMs(ttftP95)}       tone={tone(ttftP95, 0.60, 1.00)}/>
        <PerfMetric label={t('provider.perfThroughput')} hint={t('provider.perfThroughputHint')} value={`${tps} tok/s`}        tone={tps >= 150 ? 'text-brand' : tps >= 60 ? 'text-bone' : 'text-amber'}/>
        <PerfMetric label={t('provider.perfSuccess')}    hint={t('provider.perfSuccessHint')}    value={fmtPct(m.success, 1)} tone={successTone}/>
      </div>

      {/* 7d TTFT trend · editorial-style smooth chart with header-driven hover */}
      {ttftSpark.length > 0 && (
        <div className="mt-6 card p-5">
          <div className="micro text-smoke mb-4">{t('provider.perfTrend7d')}</div>
          <TtftTrendChart data={ttftSpark} color="rgb(var(--sky))"/>
        </div>
      )}

      {/* Regional TTFT breakdown */}
      <div className="mt-6 card p-5">
        <div className="flex items-center justify-between mb-4 gap-2 flex-wrap">
          <div className="micro text-smoke">{t('provider.perfRegional')}</div>
        </div>
        <div className="space-y-3">
          {regions.map(r => (
            <div key={r.name}>
              <div className="flex items-baseline justify-between mb-1.5 text-[12px]">
                <span className="text-ash">{r.name}</span>
                <span className="num text-bone">{(r.ttft * 1000) | 0}ms</span>
              </div>
              <div className="h-1.5 bg-ink-700 relative overflow-hidden">
                <div className="absolute inset-y-0 left-0 bg-sky transition-all" style={{ width: `${(r.ttft / maxRegional) * 100}%` }}/>
              </div>
            </div>
          ))}
        </div>
      </div>

    </section>
  );
}

function ProviderPage({ slug }) {
  const { t, lang } = useLang();
  const { route } = useRouter();
  const p = PROVIDERS.find(x=>x.slug===slug);
  if (!p) return <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-32 text-center text-smoke">{t('provider.notFound')}</div>;
  const descText = typeof p.desc === 'string' ? p.desc : (p.desc?.[lang] || p.desc?.en || '');

  // Model context — URL ?model= drives this state. If URL specifies a model that
  // this provider supports, use it; otherwise fall back to first supported model.
  const supportedIds = useMemo(() => Object.keys(p.modelPricing || {}), [p.slug]);
  const [model, setModel] = useState(() => {
    const urlModel = route.params.model;
    if (urlModel && supportedIds.includes(urlModel)) return urlModel;
    return supportedIds[0] || 'openai/gpt-5.5';
  });
  // Sync model when URL changes externally (e.g. back/forward)
  useEffect(() => {
    const urlModel = route.params.model;
    if (urlModel && supportedIds.includes(urlModel) && urlModel !== model) {
      setModel(urlModel);
    } else if (urlModel && !supportedIds.includes(urlModel)) {
      // URL points at an unsupported model — fix the URL silently
      const fixed = supportedIds[0];
      if (fixed) {
        history.replaceState(null, '', `#/providers/${slug}?model=${encodeURIComponent(fixed)}`);
        setModel(fixed);
      }
    }
  }, [route.params.model, supportedIds.join('|')]);

  const onModelChange = (newModel) => {
    if (!supportedIds.includes(newModel) || newModel === model) return;
    setModel(newModel);
    // replaceState (not pushState) — model switching shouldn't pollute browser history
    history.replaceState(null, '', `#/providers/${slug}?model=${encodeURIComponent(newModel)}`);
  };

  // Single source of truth for all model-aware metrics on the page
  const m = useMemo(() => getModelMetrics(p, model), [p.slug, model]);
  const modelDisplay = MODELS.find(x => x.id === model)?.display || model;

  const TitleRow = (
    <div className="flex items-center gap-4 mb-5">
      <ProviderMark slug={slug} size={64}/>
      <h1 className="serif text-4xl sm:text-5xl lg:text-6xl tracking-editorial inline-flex items-baseline gap-3 group-hover:text-brand transition-colors">
        <span>{p.name}</span>
        {p.website && (
          <I.external className="w-5 h-5 text-smoke group-hover:text-brand transition-colors -translate-y-[6px]"/>
        )}
      </h1>
    </div>
  );

  return (
    <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 pt-12">
      {/* Top meta row: back link on the left, page-level data freshness on the
          right. This indicator applies to ALL metrics on the page (panel scores,
          fingerprint, cost data, perf) — it used to live in §03 but that made
          it look section-specific. Promoting it to the top makes its scope
          explicit as page-global data. */}
      <div className="flex items-center justify-between mb-8 gap-2 flex-wrap">
        <a href="#/" className="micro text-smoke hover:text-bone inline-flex items-center gap-1.5">
          <span>←</span> {t('provider.backToRanking')}
        </a>
        <div className="flex items-center gap-2 text-[11px] text-smoke">
          <span className="w-1 h-1 rounded-full bg-brand pulse-dot"/>
          <span className="micro">{t('provider.refreshNightly')}</span>
          <span className="text-ash">·</span>
          <span className="num text-[10px] text-ash">2026-05-05 · 14:04 UTC</span>
        </div>
      </div>

      <div className="border-b border-ink-600 pb-10 mb-6 flex items-end justify-between flex-wrap gap-6">
        <div className="max-w-3xl">
          {p.website ? (
            <a
              href={p.website}
              target="_blank"
              rel="noopener noreferrer"
              className="group inline-block"
              aria-label={`${p.name} · ${websiteLabel(p.website)}`}
            >
              {TitleRow}
            </a>
          ) : (
            TitleRow
          )}
          <p className="text-ash text-[15px] leading-relaxed">{descText}</p>
        </div>
        <div className="flex flex-col gap-2 items-end">
          <a
            href={`#/run?providers=${slug}&model=${encodeURIComponent(model)}`}
            className="btn-brand px-5 py-2.5 text-sm font-medium inline-flex items-center gap-2"
          >
            {t('provider.openInRun')} <I.arrow className="w-4 h-4"/>
          </a>
        </div>
      </div>

      {/* MODEL CONTEXT BAR — drives all per-model data below */}
      <ModelContextBar p={p} model={model} onChange={onModelChange} supportedIds={supportedIds}/>

      {/* TOP METRICS — all model-aware */}
      <TopMetrics p={p} m={m} model={model}/>

      {/* MAIN GRID */}
      <div className="grid lg:grid-cols-3 gap-10 lg:gap-12">
        <div className="lg:col-span-2 space-y-16">
          <CostSection p={p} model={model}/>
          <PerformanceSection p={p} m={m} model={model}/>
          <FingerprintPanel p={p} model={model}/>
        </div>
        <ScoreSidebar p={p} m={m} model={model}/>
      </div>

      {/* INCIDENTS section temporarily hidden — incident detection pipeline
          isn't running yet, so curated mock items lacked production signal.
          IncidentsSection function kept in code for quick re-enable once
          real incident data comes online. */}
    </div>
  );
}

function FingerprintPanel({ p, model: pageModel }) {
  const { t } = useLang();
  // Initial tab follows page-level model context (so the user sees the fingerprint
  // for THIS provider × model combination first). Tab can still be switched
  // independently to inspect a different model's fingerprint without leaving the page.
  const [activeModel, setActiveModel] = useState(pageModel || MODELS[0].id);
  // Keep tab in sync when page-level model changes
  useEffect(() => {
    if (pageModel && pageModel !== activeModel) setActiveModel(pageModel);
  }, [pageModel]); // eslint-disable-line react-hooks/exhaustive-deps
  const m = MODELS.find(x => x.id === activeModel);
  const fp = fingerprint(p.slug, activeModel);

  return (
    <div className="mt-16">
      <div className="flex items-end justify-between mb-4 flex-wrap gap-3">
        <div>
          <div className="micro text-smoke mb-2">{t('provider.tagFingerprint')}</div>
          {/* Reframed: neutral chevron ("Model authenticity probes · X") instead
              of the previous binary-implying rhetorical question. */}
          <h3 className="serif text-3xl tracking-editorial">
            {t('provider.headFingerprint')} <span className="serif-it text-brand">{m.display}</span>
          </h3>
          <p className="micro text-smoke mt-2 normal-case tracking-wider">
            {t('provider.fpSubtitle')}
          </p>
        </div>
        {/* Section right rail intentionally empty — methodology link moved
            page-wide (not section-specific) and refresh timestamp now lives at
            the top as page-global metadata. */}
      </div>

      {/* Model tabs */}
      <div className="flex md:flex-wrap gap-0 border-b border-ink-600 mb-6 -mx-1 overflow-x-auto md:overflow-visible no-scroll-x">
        {MODELS.map(model => {
          const active = model.id === activeModel;
          const modelFp = fingerprint(p.slug, model.id);
          const tone = !modelFp || modelFp.unsupported ? 'text-smoke'
                     : modelFp.flag ? 'text-coral'
                     : modelFp.score >= 88 ? 'text-brand'
                     : modelFp.score >= 70 ? 'text-amber'
                     : 'text-coral';
          return (
            <button
              key={model.id}
              onClick={() => setActiveModel(model.id)}
              className={cx(
                'px-4 py-2.5 text-[12px] tracking-tight transition-colors border-b-2 -mb-px flex items-center gap-1.5',
                active ? 'border-brand text-bone' : cx('border-transparent hover:text-bone', tone)
              )}
            >
              <span>{model.display}</span>
              {modelFp?.flag && <span className="text-coral">⚠</span>}
              {modelFp?.unsupported && <span className="text-smoke text-[10px]">—</span>}
              {!modelFp?.unsupported && !modelFp?.flag && modelFp && (
                <span className={cx('num text-[10px]', tone, active && 'text-ash')}>{modelFp.score}</span>
              )}
            </button>
          );
        })}
      </div>

      <FingerprintCard p={p} m={m} fp={fp}/>
    </div>
  );
}

function FingerprintCard({ p, m, fp }) {
  const { t } = useLang();
  if (!fp) return null;

  if (fp.unsupported) {
    return (
      <div className="card p-8">
        <div className="flex items-start gap-5">
          <span className="serif-it text-6xl text-smoke leading-none">∅</span>
          <div className="flex-1 pt-1">
            <div className="micro text-smoke mb-2">{t('provider.fpUnsupportedTag')}</div>
            <h4 className="serif text-2xl tracking-editorial">
              {(t('provider.fpUnsupportedTitle', { name: '__NAME__', model: '__MODEL__' })).split(/(__NAME__|__MODEL__)/).map((part, i) => {
                if (part === '__NAME__') return <Fragment key={i}>{p.name}</Fragment>;
                if (part === '__MODEL__') return <span key={i} className="text-bone">{m.display}</span>;
                return <Fragment key={i}>{part}</Fragment>;
              })}
            </h4>
            <p className="mt-3 text-ash text-[13px] leading-relaxed max-w-2xl">{fp.reason}</p>
            <p className="mt-2 text-[11px] text-smoke leading-relaxed">
              {t('provider.fpUnsupportedNote')}
            </p>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="card p-6 space-y-5">
      {fp.flag && (
        <div className="border border-coral/40 bg-coral/[0.04] px-4 py-3">
          <div className="flex items-start gap-3">
            <I.alert className="w-4 h-4 text-coral mt-0.5 shrink-0"/>
            <div className="flex-1">
              <div className="text-coral text-[13px] tracking-tight">{fp.flag.headline}</div>
              <p className="mt-1 text-[12px] text-ash leading-relaxed">{fp.flag.detail}</p>
            </div>
          </div>
        </div>
      )}

      <div className="flex items-baseline justify-between">
        <div>
          <div className="micro text-smoke">{t('provider.matchScore')}</div>
          <div className="flex items-baseline gap-2 mt-1">
            <span className={cx('serif text-3xl sm:text-4xl lg:text-5xl tracking-editorial',
              fp.score >= 88 ? 'text-brand' : fp.score >= 70 ? 'text-amber' : 'text-coral')}>
              {fp.score}
            </span>
            <span className="text-[12px] text-smoke num">/ 100</span>
            {!fp.flag && fp.score >= 88 && <span className="micro text-brand ml-2">{t('provider.verified')}</span>}
            {!fp.flag && fp.score >= 70 && fp.score < 88 && <span className="micro text-amber ml-2">{t('provider.caution')}</span>}
            {fp.score < 70 && <span className="micro text-coral ml-2">{t('provider.risky')}</span>}
          </div>
        </div>
        <div className="text-right">
          <div className="num text-[13px] text-bone">{fp.samples}</div>
          <div className="micro text-smoke">{t('provider.samples24h')}</div>
        </div>
      </div>

      <div className="pt-4 border-t border-ink-600 space-y-4">
        <FpBar label={t('provider.fpEmbedDist')} value={fp.embedDist.toFixed(2)}
               pct={fp.embedDist * 100} ok={fp.embedDist >= 0.85}
               hint={t('provider.fpEmbedHint')}/>
        <FpBar label={t('provider.fpLengthDist')}
               value={`K-S p=${fp.lengthKsP.toFixed(2)}`}
               pct={Math.min(100, fp.lengthKsP * 200)} ok={fp.lengthKsP >= 0.20}
               hint={t('provider.fpLengthHint')}/>
        <FpRow label={t('provider.fpTokenizer')} value={fp.tokenizer.observed}
               ok={fp.tokenizer.match} expected={fp.tokenizer.expected} expectedLabel={t('provider.fpExpected')}
               hint={t('provider.fpTokenizerHint')}/>
        <FpRow label={t('provider.fpPrecision')} value={fp.precision} ok={fp.precision === 'FP16'}
               expectedLabel={t('provider.fpExpected')}
               hint={t('provider.fpPrecisionHint')}/>
        <FpRow label={t('provider.fpRefusal')}
               value={`${fp.refusalDelta > 0 ? '+' : ''}${fp.refusalDelta}pt`}
               ok={Math.abs(fp.refusalDelta) <= 3}
               expectedLabel={t('provider.fpExpected')}
               hint={t('provider.fpRefusalHint')}/>
      </div>
    </div>
  );
}

function FpBar({ label, value, pct, ok, hint }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <span className="text-[13px] text-ash">{label}</span>
        <div className="flex items-center gap-2">
          <span className="num text-[12px] text-bone">{value}</span>
          <span className={cx('text-[11px]', ok ? 'text-brand' : 'text-coral')}>{ok ? '✓' : '✗'}</span>

      <div className="h-1 bg-ink-500 relative overflow-hidden">
        <div className={cx('absolute inset-y-0 left-0 transition-all', ok ? 'bg-brand' : 'bg-coral')}
             style={{ width: `${Math.max(2, Math.min(100, pct))}%` }}></div>
      </div>
      <p className="text-[10px] text-smoke mt-1.5 leading-relaxed">{hint}</p>
    </div>
  );
}

function FpRow({ label, value, ok, expected, expectedLabel, hint }) {

    <div>
      <div className="flex items-center justify-between mb-1">
        <span className="text-[13px] text-ash">{label}</span>
        <div className="flex items-center gap-2">
          {expected && expected !== value && (
            <span className="text-[10px] text-smoke">{expectedLabel || 'expected'} <span className="text-ash">{expected}</span></span>

          <span className="num text-[12px] text-bone">{value}</span>
          <span className={cx('text-[11px]', ok ? 'text-brand' : 'text-coral')}>{ok ? '✓' : '✗'}</span>
        </div>
      </div>
      <p className="text-[10px] text-smoke mt-0.5 leading-relaxed">{hint}</p>
    </div>
  );
}

function TrustVelocity({ p }) {

  const note = (VELOCITY_NOTES[lang]?.[p.slug]) || VELOCITY_NOTES.en[p.slug] || '—';
  return (
    <div className="mt-6 pt-5 border-t border-ink-600">

        <span className={cx('text-[12px]', trendColor)}>

function Modal({ onClose, children, size = 'md' }) {
  useEffect(() => {
    const onEsc = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onEsc);
    return () => document.removeEventListener('keydown', onEsc);
  }, []);
  const widthClass = size === 'lg' ? 'max-w-2xl' : 'max-w-md';
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-ink/80 backdrop-blur-sm" onClick={onClose}>
      <div className={cx('card w-full p-6 sm:p-8 relative fade-up max-h-[90vh] overflow-y-auto', widthClass)} onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} className="absolute top-4 right-4 text-smoke hover:text-bone"><I.x className="w-4 h-4"/></button>
        {children}
      </div>
    </div>
  );
}


/* ===========================================================
   VALIDATE  —  public fingerprint tool for any AI router URL
   =========================================================== */

const VALIDATE_SAMPLES = [
  { label: 'Portkey', url: 'https://api.portkey.ai/v1/chat/completions' },
  { label: 'OpenRouter', url: 'https://openrouter.ai/api/v1/chat/completions' },
  { label: 'Together AI', url: 'https://api.together.xyz/v1/chat/completions' },
  { label: 'OpenAI direct', url: 'https://api.openai.com/v1/chat/completions' },
  { label: 'Custom router', url: 'https://your-router.example.com/v1/chat/completions' },
];

const VALIDATE_PHASES = [
  { key: 'probe',    label: 'Probing endpoint',     detail: 'TLS handshake · auth shape · response headers' },
  { key: 'sample',   label: 'Sampling probe set',   detail: 'Sending 50 fixed prompts across categories' },
  { key: 'embed',    label: 'Embedding distance',   detail: 'Cosine similarity vs canonical model output' },
  { key: 'length',   label: 'Length distribution',  detail: 'Two-sample K-S test on output token length' },
  { key: 'tok',      label: 'Tokenizer signature',  detail: 'Inferring BPE merges + leading-whitespace handling' },
  { key: 'prec',     label: 'Precision estimate',   detail: 'Numeric-task accuracy delta vs FP16 baseline' },
  { key: 'refusal',  label: 'Refusal alignment',    detail: 'Safety probe — refusal-rate delta' },
  { key: 'score',    label: 'Composite match score',detail: 'Weighted aggregate (0–100)' },
];

function ValidatePage() {
  const { t } = useLang();
  const [url, setUrl] = useState('');
  const [apiKey, setApiKey] = useState('');
  const [showKey, setShowKey] = useState(false);
  const [model, setModel] = useState('openai/gpt-5.5');
  const [phase, setPhase] = useState('idle'); // idle | running | complete
  const [phaseStatus, setPhaseStatus] = useState({}); // { key: 'pending'|'running'|'completed' }
  const [report, setReport] = useState(null);
  const [error, setError] = useState(null);

  const start = () => {
    if (!url.trim()) {
      setError(t('validate.errorPasteOrPick'));
      return;
    }
    try {
      new URL(url.match(/^https?:/) ? url : 'https://' + url);
    } catch {
      setError(t('validate.errorInvalidUrl'));
      return;
    }

    setError(null);
    setReport(null);
    const initStatus = {};
    VALIDATE_PHASES.forEach(p => { initStatus[p.key] = 'pending'; });
    setPhaseStatus(initStatus);
    setPhase('running');

    let cum = 200;
    const seed = strHash(url + model);
    const timers = [];
    VALIDATE_PHASES.forEach((p, i) => {
      const dur = 500 + ((seed + i * 37) % 700);
      const startAt = cum;
      const endAt = cum + dur;
      cum = endAt;
      timers.push(setTimeout(() => {
        setPhaseStatus(prev => ({ ...prev, [p.key]: 'running' }));
      }, startAt));
      timers.push(setTimeout(() => {
        setPhaseStatus(prev => ({ ...prev, [p.key]: 'completed' }));
      }, endAt));
    });

    timers.push(setTimeout(() => {
      const slug = inferProvider(url);
      const fp = slug ? fingerprint(slug, model) : syntheticFingerprint(url, model);
      let provider;
      if (slug) provider = PROVIDERS.find(p => p.slug === slug);
      else {
        let host = '';
        try { host = new URL(url.match(/^https?:/) ? url : 'https://' + url).hostname; } catch {}
        provider = { name: host || 'Unknown endpoint', type: 'first-seen', region: 'unknown' };
      }
      setReport({ slug, provider, fp, model });
      setPhase('complete');
    }, cum + 200));

    return () => timers.forEach(clearTimeout);
  };

  const reset = () => {
    setPhase('idle');
    setReport(null);
    setPhaseStatus({});
  };

  const m = MODELS.find(x => x.id === model);

  return (
    <div className="max-w-[1100px] mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-20">

      {/* Hero */}
      <div className="border-b border-ink-600 pb-8 mb-10">
        <div className="micro text-smoke">{t('validate.tool')}</div>
        <h1 className="serif text-4xl sm:text-5xl lg:text-6xl tracking-editorial mt-2">
          {t('validate.headPre')} <span className="serif-it text-brand">{t('validate.headIt')}</span>{t('validate.headPost')}
        </h1>
        <p className="text-ash mt-3 max-w-2xl text-[15px] leading-relaxed">
          {t('validate.subhead')}
        </p>
      </div>

      {/* Form */}
      <div className="grid lg:grid-cols-[1fr_auto] gap-6 mb-10 items-start">
        <div className="space-y-4">
          <div>
            <div className="micro text-smoke mb-2">{t('validate.endpointUrl')}</div>
            <input
              type="text"
              value={url}
              onChange={e => { setUrl(e.target.value); setError(null); }}
              onKeyDown={e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') start(); }}
              placeholder={t('validate.urlPlaceholder')}
              disabled={phase === 'running'}
              spellCheck={false}
              className="w-full bg-ink-800 border border-ink-500 focus:border-brand/60 outline-none px-4 py-3 text-[14px] text-bone num"
            />
          </div>

          <div>
            <div className="micro text-smoke mb-2 flex items-center justify-between">
              <span>{t('validate.apiKey')} <span className="text-smoke normal-case tracking-normal">{t('validate.apiKeyOptional')}</span></span>
              {apiKey && (
                <button onClick={() => setApiKey('')} disabled={phase === 'running'} className="micro text-smoke hover:text-bone disabled:opacity-40">{t('validate.clear')}</button>
              )}
            </div>
            <div className="relative">
              <input
                type={showKey ? 'text' : 'password'}
                value={apiKey}
                onChange={e => { setApiKey(e.target.value); setError(null); }}
                onKeyDown={e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') start(); }}
                placeholder={t('validate.apiKeyPlaceholder')}
                disabled={phase === 'running'}
                spellCheck={false}
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="off"
                className="w-full bg-ink-800 border border-ink-500 focus:border-brand/60 outline-none pl-4 pr-11 py-3 text-[14px] text-bone num"
              />
              <button
                type="button"
                onClick={() => setShowKey(s => !s)}
                disabled={!apiKey || phase === 'running'}
                title={showKey ? t('validate.hide') : t('validate.show')}
                className="absolute top-1/2 right-3 -translate-y-1/2 text-smoke hover:text-bone disabled:opacity-40"
              >
                {showKey ? <I.eyeOff className="w-4 h-4"/> : <I.eye className="w-4 h-4"/>}
              </button>
            </div>
            <div className="mt-2 flex items-start gap-2 text-[11px] text-smoke leading-relaxed">
              <I.lock className="w-3 h-3 mt-0.5 shrink-0 text-brand"/>
              <span>{t('validate.keyNote')}</span>
            </div>
          </div>

          {error && <div className="text-coral text-[12px]">{error}</div>}

          <div className="flex flex-wrap gap-1.5">
            <span className="micro text-smoke mr-1 self-center">{t('validate.tryLabel')}</span>
            {VALIDATE_SAMPLES.map(s => (
              <button
                key={s.label}
                onClick={() => { setUrl(s.url); setError(null); }}
                disabled={phase === 'running'}
                className="px-2.5 py-1 text-[11px] border border-ink-500 hover:border-brand hover:text-brand text-ash transition-colors disabled:opacity-40"
              >{s.label}</button>
            ))}
          </div>
        </div>
        <div className="flex flex-col gap-2">
          <div>
            <div className="micro text-smoke mb-2">{t('validate.testAgainst')}</div>
            <div className="min-w-[200px]">
              <ModelDropdown value={model} onChange={setModel} disabled={phase === 'running'} showOwner={false}/>
            </div>
          </div>
          {phase === 'idle' && (
            <button
              onClick={start}
              className="btn-brand px-6 py-3 text-sm font-medium tracking-tight inline-flex items-center justify-center gap-2"
            >
              <I.bolt className="w-4 h-4"/> {t('validate.validate')}
            </button>
          )}
          {phase === 'complete' && (
            <button onClick={reset} className="btn-ghost px-6 py-3 text-sm inline-flex items-center justify-center gap-2">
              <I.refresh className="w-4 h-4"/> {t('validate.newValidation')}
            </button>
          )}
        </div>
      </div>

      {/* Phases (running or completed) */}
      {phase !== 'idle' && (
        <div className="mb-10">
          <div className="micro text-smoke mb-3">{t('validate.probePipeline', { model: m.display })}</div>
          <div className="card divide-y divide-ink-600">
            {VALIDATE_PHASES.map(p => {
              const st = phaseStatus[p.key] || 'pending';
              const result = phase === 'complete' && report
                ? phaseResultText(p.key, report.fp, t)
                : null;
              const phaseKey = p.key.charAt(0).toUpperCase() + p.key.slice(1);
              return (
                <div key={p.key} className="flex items-start gap-4 px-5 py-3">
                  <div className="w-5 h-5 mt-0.5 flex items-center justify-center shrink-0">
                    {st === 'pending'   && <span className="text-smoke">○</span>}
                    {st === 'running'   && <I.spin className="w-3.5 h-3.5 text-brand animate-spin"/>}
                    {st === 'completed' && <I.check className="w-3.5 h-3.5 text-brand"/>}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[13px] text-bone">{t('validate.ph' + phaseKey)}</div>
                    <div className="micro text-smoke mt-0.5">{t('validate.ph' + phaseKey + 'Detail')}</div>
                  </div>
                  {result && st === 'completed' && (
                    <div className="num text-[12px] text-ash text-right shrink-0">{result}</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Final report */}
      {phase === 'complete' && report && (
        <ValidateReport report={report}/>
      )}

      {/* Methodology */}
      <div className="mt-16 pt-10 border-t border-ink-600">
        <div className="micro text-smoke">{t('validate.methodologyTag')}</div>
        <h3 className="serif text-2xl sm:text-3xl tracking-editorial mt-2">{t('validate.methodologyTitlePre')} <span className="serif-it text-brand">{t('validate.methodologyTitleIt')}</span></h3>
        <p className="text-ash text-[14px] leading-relaxed mt-3 max-w-3xl">

function phaseResultText(key, fp, t) {
  if (!fp) return null;
  switch (key) {
    case 'probe':   return '200 OK · TLS 1.3';
    case 'sample':  return t ? t('validate.probeOk', { n: fp.samples }) : `${fp.samples} prompts ok`;
    case 'embed':   return fp.embedDist != null ? fp.embedDist.toFixed(2) : null;
    case 'length':  return fp.lengthKsP != null ? `p=${fp.lengthKsP.toFixed(2)}` : null;
    case 'tok':     return fp.tokenizer ? (fp.tokenizer.match ? (t ? t('validate.tokMatch') : '✓ match') : (t ? t('validate.tokMismatch') : '✗ mismatch')) : null;
    case 'prec':    return fp.precision || null;
    case 'refusal': return fp.refusalDelta != null ? `${fp.refusalDelta > 0 ? '+' : ''}${fp.refusalDelta}pt` : null;
    case 'score':   return fp.score != null ? `${fp.score} / 100` : null;
    default: return null;
  }
}

function ValidateReport({ report }) {
  const { t } = useLang();
  const { provider, fp, slug } = report;
  if (!fp) return null;
  if (fp.unsupported) {
    return (
      <div className="card p-6 sm:p-8">
        <div className="flex items-start gap-5">
          <span className="serif-it text-6xl text-smoke leading-none">∅</span>
          <div className="flex-1">
            <div className="micro text-smoke mb-2">{t('validate.unsupportedTag')}</div>
            <h4 className="serif text-2xl tracking-editorial">{t('validate.unsupportedTitle', { name: provider.name })}</h4>
            <p className="mt-3 text-ash text-[13px] leading-relaxed max-w-2xl">{fp.reason}</p>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {fp.flag && (
        <div className="border border-coral/40 bg-coral/[0.04] px-4 py-3">
          <div className="flex items-start gap-3">
            <I.alert className="w-4 h-4 text-coral mt-0.5 shrink-0"/>
            <div className="flex-1">
              <div className="text-coral text-[13px] tracking-tight">{fp.flag.headline}</div>
              <p className="mt-1 text-[12px] text-ash leading-relaxed">{fp.flag.detail}</p>
            </div>
          </div>
        </div>
      )}

      <div className="card p-6 space-y-5">
        <div className="flex items-baseline justify-between flex-wrap gap-3">
          <div>
            <div className="micro text-smoke">{slug ? t('validate.indexedRouter') : t('validate.firstSeen')}</div>
            <div className="flex items-center gap-3 mt-2">
              {slug && <ProviderMark slug={slug}/>}
              <div>
                <div className="text-[15px] text-bone">{provider.name}</div>
                <div className="micro text-smoke">{provider.type}{slug ? ' · ' + t('validate.onTheBoard') : ' · ' + t('validate.singleProbe')}</div>
              </div>
            </div>
          </div>
          <div className="text-right">
            <div className="micro text-smoke">{t('validate.matchScore')}</div>
            <div className="flex items-baseline gap-2 mt-1">
              <span className={cx('serif text-5xl tracking-editorial',
                fp.score >= 88 ? 'text-brand' : fp.score >= 70 ? 'text-amber' : 'text-coral')}>
                {fp.score}
              </span>
              <span className="text-[12px] text-smoke num">/ 100</span>
            </div>
            <div className="text-[11px] mt-1">
              {fp.score >= 88 && <span className="text-brand">{t('validate.verified')}</span>}
              {fp.score >= 70 && fp.score < 88 && <span className="text-amber">{t('validate.caution')}</span>}
              {fp.score < 70 && <span className="text-coral">{t('validate.risky')}</span>}
              <span className="text-smoke"> · {t('validate.samplesShort', { n: fp.samples })}</span>
            </div>
          </div>
        </div>

        <div className="pt-4 border-t border-ink-600 space-y-4">
          <FpBar label={t('validate.fpEmbedDist')} value={fp.embedDist.toFixed(2)}
                 pct={fp.embedDist * 100} ok={fp.embedDist >= 0.85}
                 hint={t('validate.fpEmbedHint')}/>
          <FpBar label={t('validate.fpLengthDist')}
                 value={`K-S p=${fp.lengthKsP.toFixed(2)}`}
                 pct={Math.min(100, fp.lengthKsP * 200)} ok={fp.lengthKsP >= 0.20}
                 hint={t('validate.fpLengthHint')}/>
          <FpRow label={t('validate.fpTokenizer')} value={fp.tokenizer.observed}
                 ok={fp.tokenizer.match} expected={fp.tokenizer.expected}
                 expectedLabel={t('provider.fpExpected')}
                 hint={t('validate.fpTokenizerHint')}/>
          <FpRow label={t('validate.fpPrecision')} value={fp.precision} ok={fp.precision === 'FP16'}
                 expectedLabel={t('provider.fpExpected')}
                 hint={t('validate.fpPrecisionHint')}/>
          <FpRow label={t('validate.fpRefusal')}
                 value={`${fp.refusalDelta > 0 ? '+' : ''}${fp.refusalDelta}pt`}
                 ok={Math.abs(fp.refusalDelta) <= 3}
                 expectedLabel={t('provider.fpExpected')}
                 hint={t('validate.fpRefusalHint')}/>
        </div>

        {fp.firstSeen && (
          <div className="pt-4 border-t border-ink-600 text-[11px] text-smoke leading-relaxed flex items-start gap-2">
            <I.alert className="w-3.5 h-3.5 mt-0.5 shrink-0 text-amber"/>
            <span>{t('validate.firstSeenNote')}</span>
          </div>
        )}
        {slug && (
          <div className="pt-4 border-t border-ink-600 text-[11px] text-smoke leading-relaxed">
            {t('validate.indexedNote')} <a href={`#/providers/${slug}`} className="ulink text-brand">{t('validate.indexedLink')}</a>
          </div>
        )}
      </div>
    </div>
  );
}

/* ===========================================================
   APPLY PAGE  ·  self-service listing application
   ===========================================================
   Single long form, 6 sections, right-side sticky TOC + progress.
   Mock submission (no real backend) — generates a ref number,
   clears localStorage draft, shows inline success state.
   API key field is password-masked AND excluded from draft.
   =========================================================== */

const APPLY_DRAFT_KEY = 'applyDraft_v1';
const APPLY_SENSITIVE_FIELDS = ['apiKey'];

function useApplyDraft(initial) {
  // Returns [draft, setDraft, hasDraft, clear, restoreOffered]
  const [draft, _setDraft] = useState(initial);
  const [restoreOffered, setRestoreOffered] = useState(false);
  const [hasStoredDraft, setHasStoredDraft] = useState(false);

  // On mount, check if there's a saved draft
  useEffect(() => {
    try {
      const raw = localStorage.getItem(APPLY_DRAFT_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
          setHasStoredDraft(true);
          setRestoreOffered(true);
        }
      }
    } catch {}
  }, []);

  const setDraft = (next) => {
    _setDraft(next);
    // Auto-save (debounced via simple field-count trigger; we just write on every change)
    try {
      const stripped = { ...next };
      APPLY_SENSITIVE_FIELDS.forEach(k => { delete stripped[k]; });
      // Count non-empty top-level scalar fields
      const filled = Object.values(stripped).filter(v => {
        if (Array.isArray(v)) return v.length > 0;
        if (typeof v === 'string') return v.trim().length > 0;
        return v != null && v !== '';
      }).length;
      if (filled >= 3) {
        localStorage.setItem(APPLY_DRAFT_KEY, JSON.stringify(stripped));
      }
    } catch {}
  };

  const restore = () => {
    try {
      const raw = localStorage.getItem(APPLY_DRAFT_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        _setDraft(prev => ({ ...prev, ...parsed }));
      }
    } catch {}
    setRestoreOffered(false);
  };

  const discard = () => {
    try { localStorage.removeItem(APPLY_DRAFT_KEY); } catch {}
    setHasStoredDraft(false);
    setRestoreOffered(false);
  };

  const clearDraft = () => {
    try { localStorage.removeItem(APPLY_DRAFT_KEY); } catch {}
    setHasStoredDraft(false);
  };

  return { draft, setDraft, restoreOffered, restore, discard, clearDraft };
}

const APPLY_INITIAL_FORM = {
  // §1
  name: '', type: '', region: '', website: '',
  logoDomain: '', shortDesc: '', longDesc: '',

  apiBaseUrl: '', authMethod: '', apiKey: '',
  apiDocsUrl: '', rateLimits: '', openaiCompat: '',

function isUrl(s) {
  if (!s) return false;
  return /^https?:\/\/[^\s]+\.[^\s]+/.test(s.trim());
}
function isEmail(s) {
  if (!s) return false;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim());
}

function genRefId() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // unambiguous
  let suffix = '';
  for (let i = 0; i < 6; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
  return `APP-${y}-${m}-${day}-${suffix}`;
}

const APPLY_SECTIONS = [
  { id: 'sec1', key: 'sec1' },
  { id: 'sec2', key: 'sec2' },
  { id: 'sec3', key: 'sec3' },
  { id: 'sec4', key: 'sec4' },
  { id: 'sec5', key: 'sec5' },
  { id: 'sec6', key: 'sec6' },
];

const APPLY_REQUIRED_FIELDS = [
  'name', 'type', 'region', 'website', 'shortDesc',
  'apiBaseUrl', 'authMethod', 'apiKey',
  // §3: supportedModels OR customModels (handled separately)
  'companyName', 'contactName', 'contactEmail',
];
// 11 scalar required + 1 model-pick → total 12

function ApplyPage() {
  const { t, lang } = useLang();
  const { route, navigate } = useRouter();
  const toast = useToast();

  const { draft, setDraft, restoreOffered, restore, discard, clearDraft } = useApplyDraft(APPLY_INITIAL_FORM);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [refId, setRefId] = useState(null);
  const [activeSec, setActiveSec] = useState('sec1');
  const [copiedRef, setCopiedRef] = useState(false);

  // Scroll-spy: track which section is currently in the viewport
  useEffect(() => {
    if (refId) return; // success state — no spy needed
    const observer = new IntersectionObserver(
      entries => {
        // Pick the topmost visible section
        const visible = entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length > 0) setActiveSec(visible[0].target.id);
      },
      { rootMargin: '-20% 0px -60% 0px', threshold: 0 }
    );
    APPLY_SECTIONS.forEach(s => {
      const el = document.getElementById(s.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [refId]);

  const set = (key, val) => {
    setDraft({ ...draft, [key]: val });
    // Clear error for that field as user types
    if (errors[key]) {
      setErrors(prev => { const n = { ...prev }; delete n[key]; return n; });
    }
  };

  const setModel = (modelId, patch) => {
    const existing = draft.supportedModels.find(m => m.id === modelId);
    let next;
    if (existing) {
      next = draft.supportedModels.map(m => m.id === modelId ? { ...m, ...patch } : m);
    } else {
      next = [...draft.supportedModels, { id: modelId, listedIn: '', listedOut: '', ...patch }];
    }
    setDraft({ ...draft, supportedModels: next });
  };

  const toggleModel = (modelId) => {
    const exists = draft.supportedModels.some(m => m.id === modelId);
    const next = exists
      ? draft.supportedModels.filter(m => m.id !== modelId)
      : [...draft.supportedModels, { id: modelId, listedIn: '', listedOut: '' }];
    setDraft({ ...draft, supportedModels: next });
  };

  const addCustomModel = () => {
    setDraft({ ...draft, customModels: [...draft.customModels, { name: '', owner: '', listedIn: '', listedOut: '' }] });
  };
  const updateCustomModel = (idx, patch) => {
    const next = draft.customModels.map((m, i) => i === idx ? { ...m, ...patch } : m);
    setDraft({ ...draft, customModels: next });
  };
  const removeCustomModel = (idx) => {
    setDraft({ ...draft, customModels: draft.customModels.filter((_, i) => i !== idx) });
  };

  // Validation
  const validate = () => {
    const e = {};
    APPLY_REQUIRED_FIELDS.forEach(f => {
      const v = draft[f];
      if (!v || (typeof v === 'string' && !v.trim())) e[f] = t('apply.errRequired');
    });
    // URLs
    ['website', 'apiBaseUrl'].forEach(f => {
      if (draft[f] && !isUrl(draft[f])) e[f] = t('apply.errUrl');
    });
    ['apiDocsUrl', 'privacyUrl', 'termsUrl'].forEach(f => {
      if (draft[f] && !isUrl(draft[f])) e[f] = t('apply.errUrl');
    });
    // Email
    if (draft.contactEmail && !isEmail(draft.contactEmail)) e.contactEmail = t('apply.errEmail');
    // Lengths
    if (draft.shortDesc && draft.shortDesc.length > 120) e.shortDesc = t('apply.errTooLong').replace('{n}', 120);
    if (draft.longDesc && draft.longDesc.length > 500) e.longDesc = t('apply.errTooLong').replace('{n}', 500);
    // Models
    const totalModels = draft.supportedModels.length + draft.customModels.filter(m => m.name.trim()).length;
    if (totalModels === 0) e.supportedModels = t('apply.errNoModels');
    // Model prices
    draft.supportedModels.forEach(m => {
      if (!m.listedIn || !m.listedOut) e[`model_${m.id}`] = t('apply.errModelPrice');
    });
    return e;
  };

  const onSubmit = () => {
    const e = validate();
    setErrors(e);
    const errKeys = Object.keys(e);
    if (errKeys.length > 0) {
      // Scroll to first error
      // Map error key → DOM id
      const firstErr = errKeys[0];
      const sel = firstErr.startsWith('model_')
        ? '#sec3'
        : `#field-${firstErr}`;
      const el = document.querySelector(sel);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    setSubmitting(true);
    // Simulate network delay
    setTimeout(() => {
      const id = genRefId();
      setRefId(id);
      setSubmitting(false);
      clearDraft();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 1400);
  };

  // Required progress
  const requiredFilled = (() => {
    let n = 0;
    APPLY_REQUIRED_FIELDS.forEach(f => {
      const v = draft[f];
      if (v && (typeof v !== 'string' || v.trim())) n++;
    });
    if (draft.supportedModels.length > 0 || draft.customModels.some(m => m.name.trim())) n++;
    return n;
  })();
  const requiredTotal = APPLY_REQUIRED_FIELDS.length + 1;

  /* ---------- SUCCESS STATE ---------- */
  if (refId) {
    return <ApplySuccess refId={refId} onAnother={() => { setRefId(null); setDraft(APPLY_INITIAL_FORM); }}/>;
  }

  /* ---------- FORM ---------- */
  return (
    <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14">
      {/* Back link */}
      <a href="#/" className="micro text-smoke hover:text-bone inline-flex items-center gap-1.5 mb-6 transition-colors">
        <span className="inline-block transition-transform group-hover:-translate-x-0.5">←</span>
        {t('apply.back')}
      </a>

      {/* Page header */}
      <div className="mb-10 lg:mb-14">
        <div className="micro text-brand mb-3 tracking-widest">RR-001 · APPLY</div>
        <h1 className="font-serif text-5xl sm:text-6xl lg:text-7xl text-bone tracking-editorial leading-[0.95]">
          {t('apply.pageTitle')}
          <span className="text-brand italic">.</span>
        </h1>
        <p className="mt-5 text-ash text-lg max-w-2xl leading-relaxed">{t('apply.pageSubtitle')}</p>
      </div>

      {/* Restore draft banner */}
      {restoreOffered && (
        <div className="mb-8 border border-amber/40 bg-amber/[0.06] px-4 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-start gap-3">
            <I.info className="w-4 h-4 text-amber shrink-0 mt-0.5"/>
            <div>
              <div className="text-sm text-bone">{t('apply.draftBannerTitle')}</div>
              <div className="micro text-smoke mt-0.5">{t('apply.draftBannerSub')}</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={discard} className="px-3 py-1.5 text-[12px] tracking-wider text-ash hover:text-bone border border-ink-500 hover:border-ash transition-colors">
              {t('apply.draftDiscard')}
            </button>
            <button onClick={restore} className="px-3 py-1.5 text-[12px] tracking-wider text-ink bg-amber hover:bg-amber/90 transition-colors">
              {t('apply.draftRestore')}
            </button>
          </div>
        </div>
      )}

      <div className="grid lg:grid-cols-[1fr_320px] gap-10 lg:gap-14">
        {/* Form column */}
        <div className="min-w-0">
          <ApplySection1 draft={draft} set={set} errors={errors}/>
          <ApplySection2 draft={draft} set={set} errors={errors}/>
          <ApplySection3
            draft={draft}
            toggleModel={toggleModel}
            setModel={setModel}
            addCustomModel={addCustomModel}
            updateCustomModel={updateCustomModel}
            removeCustomModel={removeCustomModel}
            errors={errors}
          />
          <ApplySection4 draft={draft} set={set} errors={errors}/>
          <ApplySection5 draft={draft} set={set} errors={errors}/>
          <ApplySection6 draft={draft} set={set} errors={errors}/>

          {/* Bottom submit */}
          <div className="mt-12 pt-8 border-t border-ink-600">
            <button
              onClick={onSubmit}
              disabled={submitting}
              className={cx(
                'w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3.5 text-sm tracking-wide transition-all',
                submitting ? 'bg-ink-600 text-smoke cursor-wait' : 'btn-brand bg-brand-deep text-bone hover:bg-brand'
              )}
            >
              {submitting ? <I.spin className="w-4 h-4 animate-spin"/> : <I.send className="w-4 h-4"/>}
              {submitting ? t('apply.submitting') : t('apply.submitBtn')}
            </button>
            <p className="mt-3 text-[12px] text-smoke max-w-xl leading-relaxed">{t('apply.submitHint')}</p>
          </div>
        </div>

        {/* Right column · sticky TOC */}
        <ApplyTOC
          activeSec={activeSec}
          filled={requiredFilled}
          total={requiredTotal}
          onSubmit={onSubmit}
          submitting={submitting}
        />
      </div>
    </div>
  );
}

/* ---------- Right column · sticky TOC ---------- */
function ApplyTOC({ activeSec, filled, total, onSubmit, submitting }) {
  const { t } = useLang();
  const pct = Math.round((filled / total) * 100);
  return (
    <aside className="hidden lg:block">
      <div className="sticky top-24">
        {/* Progress card */}
        <div className="border border-ink-600 bg-ink-800 p-5 mb-4">

            {t('apply.reqProgress').replace('{filled}', filled).replace('{total}', total)}

          <div className="h-1.5 bg-ink-600 mb-4 overflow-hidden">
            <div
              className="h-full bg-brand transition-all duration-300 ease-out"
              style={{ width: `${pct}%` }}
            />
          </div>
          <button
            onClick={onSubmit}
            disabled={submitting}
            className={cx(
              'w-full inline-flex items-center justify-center gap-2 py-3 text-sm tracking-wide transition-all',
              submitting ? 'bg-ink-600 text-smoke cursor-wait' : 'btn-brand bg-brand-deep text-bone hover:bg-brand'
            )}
          >
            {submitting ? <I.spin className="w-4 h-4 animate-spin"/> : null}
            {submitting ? t('apply.submitting') : t('apply.submitBtn')}
          </button>
        </div>

        {/* Section anchor list */}
        <nav className="border border-ink-600">
          {APPLY_SECTIONS.map(s => {
            const active = activeSec === s.id;
            return (
              <a
                key={s.id}
                href={`#/apply`}
                onClick={(e) => {
                  e.preventDefault();
                  const el = document.getElementById(s.id);
                  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }}
                className={cx(
                  'block px-4 py-2.5 text-[13px] tracking-tight border-l-2 transition-colors',
                  active
                    ? 'border-brand bg-brand/[0.06] text-bone'
                    : 'border-transparent text-ash hover:text-bone hover:bg-ink-700'
                )}
              >
                {t(`apply.${s.key}`)}

          })}
        </nav>
      </div>
    </aside>
  );
}

/* ---------- Success inline state ---------- */
function ApplySuccess({ refId, onAnother }) {
  const { t } = useLang();
  const [copied, setCopied] = useState(false);
  const onCopy = () => {
    try {
      navigator.clipboard.writeText(refId);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch {}
  };
  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-20 lg:py-28">
      {/* Decorative check */}
      <div className="mb-10 inline-flex items-center justify-center w-16 h-16 border border-brand text-brand">
        <I.check className="w-8 h-8"/>
      </div>

      <div className="micro text-brand mb-3 tracking-widest">RR-001 · APPLY · RECEIVED</div>
      <h1 className="font-serif text-5xl sm:text-6xl text-bone tracking-editorial leading-[0.95] mb-8">
        {t('apply.successTitle')}
        <span className="text-brand italic">.</span>
      </h1>

      {/* Reference number card */}
      <div className="border border-ink-600 bg-ink-800 p-6 mb-10">
        <div className="micro text-smoke mb-2 tracking-wider">{t('apply.successRefLabel')}</div>
        <div className="flex items-center gap-3 flex-wrap">
          <code className="font-mono text-2xl sm:text-3xl text-bone tracking-tight num select-all">{refId}</code>
          <button
            onClick={onCopy}
            className="inline-flex items-center gap-1.5 px-3 py-2 text-[12px] tracking-wider text-ash hover:text-bone border border-ink-500 hover:border-bone transition-colors"
          >
            {copied ? <I.check className="w-3.5 h-3.5 text-brand"/> : <I.copy className="w-3.5 h-3.5"/>}
            {copied ? t('apply.successCopied') : t('apply.successCopyRef')}
          </button>
        </div>
      </div>

      {/* Next steps */}
      <div className="mb-12">
        <div className="micro text-smoke mb-4 tracking-wider">{t('apply.successNextTitle')}</div>
        <ol className="space-y-3">
          {[t('apply.successNext1'), t('apply.successNext2'), t('apply.successNext3'), t('apply.successNext4')].map((line, i) => (
            <li key={i} className="flex items-start gap-3 text-sm text-bone leading-relaxed">
              <span className="num text-smoke shrink-0 w-5 text-right">{i + 1}.</span>
              <span>{line}</span>
            </li>
          ))}
        </ol>
      </div>

      <div className="flex items-center gap-3 flex-wrap pt-8 border-t border-ink-600">
        <a href="#/" className="btn-brand bg-brand-deep text-bone hover:bg-brand inline-flex items-center gap-2 px-6 py-3 text-sm tracking-wide transition-all">
          {t('apply.successDone')}
        </a>
        <button
          onClick={onAnother}
          className="inline-flex items-center gap-2 px-6 py-3 text-sm tracking-wide text-ash hover:text-bone border border-ink-500 hover:border-bone transition-colors"
        >
          {t('apply.successAnother')}
        </button>
      </div>
    </div>
  );
}

/* ===========================================================
   APP ROOT
   =========================================================== */

function App() {
  const { route } = useRouter();
  const path = route.path;

  let page;
  if (path === '/') page = <HomePage/>;
  else if (path === '/run' || path === '/compare' || path === '/playground') page = <RunPage/>;
  else if (path === '/validate') page = <ValidatePage/>;
  else if (path === '/docs') page = <DocsPage/>;
  else if (path === '/apply') page = <ApplyPage/>;
  else if (path.startsWith('/providers/')) {
    const slug = path.replace('/providers/', '');
    page = <ProviderPage slug={slug}/>;
  } else page = <HomePage/>;

  // Scroll to top on route change. Use useLayoutEffect so the scroll fires
  // BEFORE the browser paints the new page — otherwise the new page briefly
  // renders at the old scroll position, causing visible jitter on nav clicks.
  useLayoutEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [path]);

  // Run page is a tool with a fixed-bottom compose — the global Footer would
  // compete with it for the bottom of the viewport. Hide footer on /run.
  const showFooter = !(path === '/run' || path === '/compare' || path === '/playground');

  return (
    <div className="min-h-screen flex flex-col">
      <Header/>
      <main className="flex-1">
        {page}
      </main>
      {showFooter && <Footer/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <RouterProvider>
    <ThemeProvider>
      <LangProvider>
        <ToastProvider>
          <App/>
        </ToastProvider>
      </LangProvider>
    </ThemeProvider>
  </RouterProvider>
);
