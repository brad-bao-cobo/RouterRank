<script>
  // Apply theme before any paint to avoid FOUC.
  (function () {
    try {
      var t = localStorage.getItem('rr-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useMemo, createContext, useContext, Fragment } = React;

/* ===========================================================
   MOCK DATA
   =========================================================== */

const MODELS = [
  { id: 'openai/gpt-5.5', display: 'GPT-5.5', family: 'GPT', owner: 'OpenAI', officialIn: 1.25, officialOut: 10.0, ctx: 400000,
    caps: { stream: true, tool: true, json: true, zdr: true } },
  { id: 'anthropic/claude-4.6-sonnet', display: 'Claude 4.6 Sonnet', family: 'Claude', owner: 'Anthropic', officialIn: 3.0, officialOut: 15.0, ctx: 200000,
    caps: { stream: true, tool: true, json: true, zdr: true } },
  { id: 'google/gemini-3.1-pro', display: 'Gemini 3.1 Pro', family: 'Gemini', owner: 'Google', officialIn: 1.25, officialOut: 10.0, ctx: 2000000,
    caps: { stream: true, tool: true, json: true, zdr: false } },
  { id: 'deepseek/deepseek-v3.2', display: 'DeepSeek V3.2', family: 'DeepSeek', owner: 'DeepSeek', officialIn: 0.27, officialOut: 1.10, ctx: 128000,
    caps: { stream: true, tool: true, json: true, zdr: false } },
  { id: 'meta/llama-4-maverick', display: 'Llama 4 Maverick', family: 'Llama', owner: 'Meta', officialIn: 0.27, officialOut: 0.85, ctx: 1000000,
    caps: { stream: true, tool: true, json: true, zdr: false } },
  { id: 'mistral/mistral-large-2.1', display: 'Mistral Large 2.1', family: 'Mistral', owner: 'Mistral', officialIn: 2.0, officialOut: 6.0, ctx: 128000,
    caps: { stream: true, tool: true, json: true, zdr: false } },
];

// GatewayBench score helpers — 9 sub-dimensions across L1/L2/L3
// Spec at /Users/jianing.jiang/Desktop/评分规则.md
function computeL1(s) {
  return Math.round(s.L1.modelAuth * 0.5 + s.L1.billingTrans * 0.3 + s.L1.cacheFraud * 0.2);
}
function computeL2(s) {
  return Math.round(s.L2.latency * 0.5 + s.L2.throughput * 0.3 + s.L2.longContext * 0.2);
}
function computeL3(s) {
  return Math.round(s.L3.listPricing * 0.35 + s.L3.relativeToOfficial * 0.4 + s.L3.hiddenCost * 0.25);
}
function computeOverall(p) {
  return Math.round(computeL1(p.scores) * 0.4 + computeL3(p.scores) * 0.4 + computeL2(p.scores) * 0.2);
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Per-(provider, model) derived metrics. Single source of truth for everything
// the ProviderPage shows in model context. Cost-derived L3 is REAL (uses real
// pricing data). L1/L2/perf metrics are deterministically faked via strHash
// anchored on the provider's platform-level scores, so:
//   1. Same (provider, model) always yields the same numbers (refresh-safe)
//   2. Different models on the same provider give slightly different numbers
//      (visible feedback when user switches model)
//   3. Numbers stay "in the ballpark" of the provider's platform reputation
function getModelMetrics(p, modelId) {
  const mp = p.modelPricing?.[modelId];
  if (!mp) return null;
  const modelMeta = MODELS.find(m => m.id === modelId);
  const refIn  = modelMeta?.officialIn  ?? mp.listedIn;
  const refOut = modelMeta?.officialOut ?? mp.listedOut;

  // L3 is REAL — derived from how this provider's listed/observed compares to the
  // model's official price. Markup penalty (vs official) + drift penalty (observed
  // vs listed). Lower markup + lower drift = higher L3.
  const listedTotal   = mp.listedIn + mp.listedOut;
  const observedTotal = mp.observedIn + mp.observedOut;
  const refTotal      = refIn + refOut;
  const markup = ((listedTotal / refTotal) - 1) * 100;       // can be negative (cheaper than official)
  const drift  = ((observedTotal / listedTotal) - 1) * 100;  // observed vs listed
  // Markup is penalized symmetrically (under-pricing is suspicious too).
  // Drift is asymmetric (paying more than listed is worse than paying less).
  const L3 = Math.round(clamp(96 - Math.abs(markup) * 0.9 - (drift > 0 ? drift * 2.2 : Math.abs(drift) * 1.0), 50, 99));

  // L1 / L2 are anchored on the provider's platform scores with model-specific
  // ±5pt deterministic variation via strHash.
  const seed = (k) => strHash(p.slug + modelId + k) % 100;
  const L1base = computeL1(p.scores);
  const L2base = computeL2(p.scores);
  const L1 = Math.round(clamp(L1base + (seed('L1') - 50) / 12, 50, 99));
  const L2 = Math.round(clamp(L2base + (seed('L2') - 50) / 12, 50, 99));

  // Perf metrics: ±15% deterministic jitter around provider's platform value.
  const jitter = (k, lo, hi) => lo + (seed(k) / 100) * (hi - lo);
  const ttft     = +clamp(p.ttft    * jitter('ttft', 0.85, 1.15), 0.10, 2.0).toFixed(3);
  const latency  = +clamp(p.latency * jitter('lat',  0.85, 1.15), 0.30, 5.0).toFixed(2);
  const p95      = +clamp(p.p95     * jitter('p95',  0.85, 1.15), 0.50, 10.0).toFixed(2);
  const success  = +clamp(p.success - (seed('succ') % 6) / 1000, 0.93, 1.0).toFixed(4);
  const samples  = Math.round(p.samples * (0.7 + (seed('samp') / 100) * 0.4));

  const overall = Math.round(0.4 * L1 + 0.4 * L3 + 0.2 * L2);
  return {
    L1, L2, L3,
    overall, tier: tier(overall),
    ttft, latency, p95, success, samples,
    cost: mp, refIn, refOut, markup, drift,
  };
}
function tier(overall) {
  if (overall >= 90) return 'AAA';
  if (overall >= 80) return 'AA';
  if (overall >= 70) return 'A';
  if (overall >= 60) return 'B';
  return 'C';
}
function tierTone(t) {
  return ({ AAA: 'brand', AA: 'brand', A: 'amber', B: 'coral', C: 'coral' })[t] || 'smoke';
}

// One-line evidence note per L group on the Provider detail score breakdown.
function subNote(p, group) {
  if (group === 'L1') {
    const inflate = p.scores.L1.billingTrans >= 88 ? 'token count matches official' : 'minor inflation flagged';
    const cache = p.scores.L1.cacheFraud >= 80
      ? 'cache TTL respected'
      : p.scores.L1.cacheFraud >= 65 ? 'sporadic cache discrepancy' : 'cache claims unreliable';
    return `${inflate} · ${cache}`;
  }
  if (group === 'L2') {
    return `p50 ${p.latency.toFixed(1)}s · p95 ${p.p95.toFixed(1)}s · ${p.samples.toLocaleString()} samples · ${(p.success * 100).toFixed(1)}% success`;
  }
  if (group === 'L3') {
    const baseline = p.type === 'router' ? '1.055× baseline (5.5% router fee)' :
                     p.type === 'gateway' ? '1.0× baseline (passthrough gateway)' :
                     p.type === 'self_host' ? 'compared to upstream cost' :
                     'compared to direct-vendor pricing';
    return `${fmtUSD(p.cost)} blended · ${p.costDelta > 0 ? '+' : ''}${p.costDelta}% vs ref · ${baseline}`;
  }
  return '';
}

function tokenCost(p, inTok, outTok) {
  return inTok * p.costIn / 1e6 + outTok * p.costOut / 1e6;
}

// Spec §7.5 — stepped bands
function latencyScore(s) {
  if (s < 1) return 100;
  if (s < 2) return 85;
  if (s < 4) return 65;
  if (s < 8) return 40;
  return 20;
}

// Spec §7.2 — linear interpolation between anchor points on price_ratio
function costScore(observed, ref) {
  if (!ref || ref <= 0) return 50;
  const r = observed / ref;
  const anchors = [[0.8, 100], [1.0, 85], [1.2, 70], [1.5, 40], [2.0, 10]];
  if (r <= anchors[0][0]) return anchors[0][1];
  if (r >= anchors[anchors.length - 1][0]) return anchors[anchors.length - 1][1];
  for (let i = 0; i < anchors.length - 1; i++) {
    const [r0, s0] = anchors[i], [r1, s1] = anchors[i + 1];
    if (r >= r0 && r <= r1) return Math.round(s0 + (s1 - s0) * (r - r0) / (r1 - r0));
  }
  return 50;
}

// How each provider re-shapes a generated answer (verbosity & post-script)
const PROVIDER_STYLE = {
  portkey:    { verbosity: 1.00, postscript: '' },
  openrouter: { verbosity: 0.85, postscript: '' },
  bai:        { verbosity: 0.55, postscript: '' },
  together:   { verbosity: 1.10, postscript: '\n\n_Generated via Together direct-inference path; no fallback engaged._' },
  fireworks:  { verbosity: 0.95, postscript: '' },
  anyscale:   { verbosity: 0.90, postscript: '' },
  replicate:  { verbosity: 0.80, postscript: '' },
  litellm:    { verbosity: 1.00, postscript: '' },

function detectBenchmark(prompt) {
  const p = (prompt || '').toLowerCase();
  if (/account abstraction|erc-?4337|paymaster|userop|账户抽象/.test(p)) return 'default';
  if (/中文|日本語|español|多语|multilingual|一句中文/.test(p)) return 'multi';
  if (/三个?箱子|标签.*贴?错|箱子.*苹果|苹果.*橘子.*混装/.test(p)) return 'reasoning';
  if (/(box|labels?\s+are\s+wrong|riddle)/.test(p) && /(apple|orange|fruit)/.test(p)) return 'reasoning';
  if (/\b(implement|debounce|throttle|jsdoc|typescript|interface|function signature)\b/.test(p)) return 'coding';
  if (/debounce|防抖|节流|jsdoc|类型签名|typescript/.test(p)) return 'coding';
  if (/严格\s*json|json\s*格式|json\s*输出|抽取.*json|以.*json.*返回/.test(p)) return 'json';
  if (/(strict\s+)?json|extract.*as json|respond.*json/.test(p)) return 'json';
  if (/概率|不放回|抽到|推导过程|红球|蓝球/.test(p)) return 'math';
  if (/probability|p\(|c\(|fraction|integral|derive|show your work|compute/.test(p)) return 'math';
  if (/同事.*机密|机密文件.*同事|合规.*步骤|应该怎么处理|不小心.*发/.test(p)) return 'safety';
  if (/coworker|confidential|safely|ethical|policy violation/.test(p)) return 'safety';
  if (/法律合同|30\s*页|长上下文|长文档|总结.*要点|风险.*义务.*终止/.test(p)) return 'long';
  if (/legal document|summarize.*page|long context|attached document/.test(p)) return 'long';
  return 'default';
}

function strHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return Math.abs(h);
}

function getMockResponse(prompt, slug) {
  const bench = detectBenchmark(prompt);
  const pool = BENCHMARK_RESPONSES[bench] || BENCHMARK_RESPONSES.default;
  const idx = strHash(slug + bench) % pool.length;
  let resp = pool[idx];
  const style = PROVIDER_STYLE[slug] || { verbosity: 1, postscript: '' };
  if (style.verbosity < 0.7) {
    const paras = resp.split(/\n\n+/);
    resp = paras.slice(0, Math.max(1, Math.ceil(paras.length * 0.55))).join('\n\n');
  } else if (style.verbosity > 1.05 && style.postscript) {
    resp = resp + style.postscript;
  }
  return resp;
}

// Stable per-(prompt, slug) score in [base, base+span)
function seededScore(prompt, slug, salt, base, span) {
  return base + (strHash((prompt || '') + slug + salt) % span);
}

// Provider mounts only certain model families honestly. Pure inference
// providers (Together / Fireworks / Anyscale / Replicate) do not serve
// closed-source models — surfacing this is part of the truth.
function fingerprint(slug, modelId) {
  const p = PROVIDERS.find(x => x.slug === slug);
  const m = MODELS.find(x => x.id === modelId);
  if (!p || !m) return null;

  const closed = ['OpenAI', 'Anthropic', 'Google'].includes(m.owner);
  const isPureInference = p.type === 'inference';
  if (closed && isPureInference) {
    return {
      unsupported: true,
      reason: `${p.name} is a direct-inference provider for open-weight models. Requests for ${m.owner} models would not be routed honestly.`,
    };
  }

  const key = `${slug}:${modelId}`;
  const ov = FINGERPRINT_OVERRIDES[key] || {};
  const seed = strHash(key);

  const base = p.trust / 100;
  const noise = ((seed % 200) - 100) / 4000;
  const embedDist = ov.embedDist != null ? ov.embedDist
                   : Math.min(0.99, Math.max(0.45, base + noise + 0.02));

  const lengthKsP = ov.lengthKsP != null ? ov.lengthKsP
                   : Math.min(0.95, Math.max(0.04, 0.40 + (p.trust - 80) / 120 + ((seed % 100) - 50) / 600));

  const tokExpected = m.owner === 'OpenAI' ? 'cl100k_base'
                     : m.owner === 'Anthropic' ? 'claude'
                     : m.owner === 'Google' ? 'gemini'
                     : 'sentencepiece';
  const tokenizer = ov.tokenizer
    ? { observed: ov.tokenizer.observed, expected: ov.tokenizer.expected || tokExpected, match: ov.tokenizer.observed === (ov.tokenizer.expected || tokExpected) }
    : { observed: tokExpected, expected: tokExpected, match: true };

  const precision = ov.precision || (p.trust >= 85 ? 'FP16' : 'FP16');

  const refusalDelta = ov.refusalDelta != null ? ov.refusalDelta
                      : Math.round(((seed % 14) - 7) * (1 - p.trust / 110));

  const samples = Math.max(48, Math.round(p.samples / (MODELS.length * 2) + (seed % 80)));

  // Composite match score (0-100) — mirrors the visible bars below
  const score = Math.round(
    Math.max(0, embedDist * 50) +
    lengthKsP * 20 +
    (tokenizer.match ? 15 : 4) +
    (precision === 'FP16' ? 10 : precision === 'Q8' ? 6 : 3) +
    Math.max(0, 5 - Math.abs(refusalDelta) * 0.5)
  );

  return {
    embedDist, lengthKsP, tokenizer, precision, refusalDelta,
    samples, score,
    flag: ov.flag || null,
  };
}

// Try to recognize a known PROVIDER from a pasted URL, e.g. https://api.together.ai/v1
function inferProvider(rawUrl) {
  if (!rawUrl) return null;
  let host = '';
  try {
    const u = new URL(rawUrl.match(/^https?:/) ? rawUrl : 'https://' + rawUrl);
    host = u.hostname.toLowerCase();
  } catch { return null; }
  const stripped = host.replace(/^(api|www|inference|router|gateway)\./, '');
  for (const p of PROVIDERS) {
    if (!p.domain) continue;
    if (host === p.domain || host.endsWith('.' + p.domain) || stripped === p.domain) return p.slug;
  }
  return null;
}

// Deterministic fingerprint for any URL we haven't sampled before. Lower
// confidence than `fingerprint()` because it's a single-shot probe, not
// a continuous panel.
function syntheticFingerprint(url, modelId) {
  const m = MODELS.find(x => x.id === modelId);
  if (!m) return null;
  const seed = strHash(url + ':' + modelId);
  // First-seen endpoints get a moderate baseline. Hash drives the spread.
  const baseTier = 60 + (seed % 30); // 60..89
  const embedDist = Math.min(0.97, Math.max(0.55, (baseTier / 100) + ((seed % 200) - 100) / 5000));
  const lengthKsP = Math.min(0.92, Math.max(0.05, 0.30 + (baseTier - 70) / 150 + ((seed % 100) - 50) / 700));

  const tokExpected = m.owner === 'OpenAI' ? 'cl100k_base'
                     : m.owner === 'Anthropic' ? 'claude'
                     : m.owner === 'Google' ? 'gemini'
                     : 'sentencepiece';
  // Random-ish chance of tokenizer mismatch for unknown URLs (signals fallback risk)
  const tokMatch = (seed % 100) > 12;
  const tokenizer = {
    observed: tokMatch ? tokExpected : 'cl100k_base',
    expected: tokExpected,
    match: tokMatch,
  };
  const precision = (seed % 100) > 30 ? 'FP16' : (seed % 100) > 8 ? 'Q8' : 'Q4';
  const refusalDelta = Math.round(((seed % 18) - 9) * 0.7);
  const samples = 40 + (seed % 30); // single-probe; small sample
  const score = Math.round(
    Math.max(0, embedDist * 50) +
    lengthKsP * 20 +
    (tokenizer.match ? 15 : 4) +
    (precision === 'FP16' ? 10 : precision === 'Q8' ? 6 : 3) +
    Math.max(0, 5 - Math.abs(refusalDelta) * 0.5)
  );
  let flag = null;
  if (!tokenizer.match) flag = { kind: 'tokenizer_mismatch', headline: 'Tokenizer mismatch', detail: `Observed tokenizer (${tokenizer.observed}) does not match the expected ${tokenizer.expected} signature for ${m.display}. This is a strong signal of silent fallback or a non-canonical variant.` };
  else if (precision === 'Q4') flag = { kind: 'quantization', headline: 'Aggressive quantization (Q4)', detail: 'Q4 weights detected via numeric task accuracy delta. Cost is lower; reasoning benchmarks underperform by ~9 points vs FP16.' };
  else if (precision === 'Q8') flag = { kind: 'quantization', headline: 'Quantization detected (Q8)', detail: '~6% accuracy delta on numeric tasks vs canonical FP16 baseline.' };
  return {
    firstSeen: true,
    embedDist, lengthKsP, tokenizer, precision, refusalDelta,
    samples, score, flag,
  };
}

// 30-day trust trajectory + streak + recovery, all deterministic from p.slug
const TRUST_DRIFT = {
  portkey: 0, openrouter: -1, bai: 0, together: +1,
  fireworks: 0, anyscale: -1, replicate: -2, litellm: +3,
};

function trustHistory(p) {
  const drift = TRUST_DRIFT[p.slug] ?? 0;
  const seed = strHash('trust:' + p.slug);
  const spark = [];
  // value 30 days ago = current trust − drift; today = current trust
  const startVal = p.trust - drift;
  for (let i = 0; i < 30; i++) {
    const linear = startVal + (drift * i / 29);
    const noise = (((seed * (i + 7)) % 100) - 50) / 50; // ±1
    // bai gets a dip & recover story
    let bump = 0;
    if (p.slug === 'bai' && i >= 6 && i <= 12) bump = -3 + (i - 9);
    spark.push(Math.round(linear + noise + bump));
  }

  const mediums = (p.incidents || []).filter(i => i.sev === 'medium' || i.sev === 'high');
  const parseAgoH = s => {
    const m = /(\d+)\s*([hd])/.exec(s || '');
    return m ? Number(m[1]) * (m[2] === 'd' ? 24 : 1) : Infinity;
  };
  const oldestMediumH = mediums.length ? Math.min(...mediums.map(i => parseAgoH(i.time))) : null;
  const streakDays = oldestMediumH == null ? 30 + (seed % 14) : Math.max(0, Math.floor(oldestMediumH / 24));

  const recoveryMin = (p.incidents || []).length === 0 ? null : 4 + (seed % 28);

  const delta30 = spark[spark.length - 1] - spark[0];
  const trend = delta30 >= 2 ? 'up' : delta30 <= -2 ? 'down' : 'flat';

  return { spark, streakDays, recoveryMin, delta30, trend };
}

/* ===========================================================
   ROUTING
   =========================================================== */

const RouterCtx = createContext(null);

function useRouter() {
  return useContext(RouterCtx);
}

function parseHashStr(s) {
  const h = (s || '').replace(/^#/, '') || '/';
  const [path, qs = ''] = h.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs));
  return { path, params };
}

function RouterProvider({ children }) {
  const [route, setRoute] = useState(() => parseHashStr(window.location.hash));

  useEffect(() => {
    const onHash = () => setRoute(parseHashStr(window.location.hash));
    window.addEventListener('hashchange', onHash);
    window.addEventListener('popstate', onHash);

    // Click delegation — robust against sandboxed iframes that swallow
    // the hashchange event when href="#/..." anchors fire.
    const onClick = (e) => {
      if (e.defaultPrevented) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || (!href.startsWith('#/') && href !== '#')) return;
      if (a.target && a.target !== '' && a.target !== '_self') return;
      e.preventDefault();
      const next = href === '#' ? '#/' : href;
      const nextRoute = parseHashStr(next);
      const isRouteChange = window.location.hash !== next;
      if (isRouteChange) {
        try { history.pushState(null, '', next); }
        catch { window.location.hash = next.slice(1); }
      }
      setRoute(nextRoute);
      // Scroll reset happens in App's useLayoutEffect on path change — it
      // runs after React commits the new DOM but before browser paints, so
      // the new page never shows at the old scroll position.
    };
    document.addEventListener('click', onClick);

    return () => {
      window.removeEventListener('hashchange', onHash);
      window.removeEventListener('popstate', onHash);
      document.removeEventListener('click', onClick);
    };
  }, []);

  const navigate = (path, params = {}) => {
    const qs = new URLSearchParams(params).toString();
    const target = qs ? `#${path}?${qs}` : `#${path}`;
    if (window.location.hash !== target) {
      try { history.pushState(null, '', target); }
      catch { window.location.hash = target.slice(1); }
    }
    setRoute(parseHashStr(target));
  };

  return <RouterCtx.Provider value={{ route, navigate }}>{children}</RouterCtx.Provider>;
}

/* ===========================================================
   TOAST  +  STREAMING TEXT
   =========================================================== */

const ToastCtx = createContext(null);
const useToast = () => useContext(ToastCtx);

function ToastProvider({ children }) {
  const [msg, setMsg] = useState('');
  const tRef = useRef(null);
  const show = (m) => {
    setMsg(m);
    if (tRef.current) clearTimeout(tRef.current);
    tRef.current = setTimeout(() => setMsg(''), 1900);
  };
  return (
    <ToastCtx.Provider value={{ show }}>
      {children}
      {msg && (
        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 bg-bone text-ink text-[12px] tracking-tight fade-up shadow-2xl flex items-center gap-2">
          <span className="w-1.5 h-1.5 bg-brand-deep rounded-full"></span>
          {msg}
        </div>
      )}
    </ToastCtx.Provider>
  );
}

const LangCtx = createContext(null);
const useLang = () => useContext(LangCtx);

function LangProvider({ children }) {
  const [lang, setLang] = useState(() => {
    try {
      const saved = localStorage.getItem('rr-lang');
      if (saved === 'en' || saved === 'zh') return saved;
    } catch {}
    if (typeof navigator !== 'undefined' && /^zh/i.test(navigator.language || '')) return 'zh';
    return 'en';
  });
  useEffect(() => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    try { localStorage.setItem('rr-lang', lang); } catch {}
  }, [lang]);

  const t = (path, vars) => {
    const walk = (root) => path.split('.').reduce((o, k) => (o && o[k] != null ? o[k] : undefined), root);
    let val = walk(I18N[lang]);
    if (val === undefined && lang !== 'en') val = walk(I18N.en);
    if (val === undefined) return path;
    if (typeof val === 'string' && vars) {
      Object.keys(vars).forEach(k => {
        val = val.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      });
    }
    return val;
  };

  const toggle = () => setLang(l => (l === 'zh' ? 'en' : 'zh'));
  return <LangCtx.Provider value={{ lang, setLang, toggle, t }}>{children}</LangCtx.Provider>;
}

const ThemeCtx = createContext(null);
const useTheme = () => useContext(ThemeCtx);

function ThemeProvider({ children }) {
  const [theme, setTheme] = useState(() => {
    if (typeof document !== 'undefined' && document.documentElement.dataset.theme) {
      return document.documentElement.dataset.theme;
    }
    if (typeof localStorage !== 'undefined') {
      const saved = localStorage.getItem('rr-theme');
      if (saved === 'light' || saved === 'dark') return saved;
    }
    if (typeof window !== 'undefined' && window.matchMedia) {
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    return 'dark';
  });
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('rr-theme', theme); } catch {}
  }, [theme]);
  const toggle = () => {
    // Suspend transitions for one paint so border / bg flips at the same
    // instant — avoids the faint border "fading through invisible" during
    // the 150ms transition-colors window when bg snaps and border eases.
    document.documentElement.classList.add('theme-switching');
    setTheme(t => (t === 'light' ? 'dark' : 'light'));
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.documentElement.classList.remove('theme-switching');
      });
    });
  };
  return <ThemeCtx.Provider value={{ theme, toggle }}>{children}</ThemeCtx.Provider>;
}

function useStreamingText(text, tokenMs = 18) {
  const [shown, setShown] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (!text) { setShown(''); setDone(false); return; }
    setShown('');
    setDone(false);
    const tokens = text.match(/\S+\s*|\s+/g) || [];
    let i = 0;
    const id = setInterval(() => {
      const step = 1 + Math.floor(Math.random() * 3);
      i = Math.min(i + step, tokens.length);
      setShown(tokens.slice(0, i).join(''));
      if (i >= tokens.length) { clearInterval(id); setDone(true); }
    }, tokenMs);
    return () => clearInterval(id);
  }, [text, tokenMs]);

  return { shown, done };
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(el);
    return true;
  }
}

// Resolve (provider, modelId) → blended listed cost; falls back to provider's
// default model when modelId is unsupported. Returns null when the provider
// has no pricing for that model at all (caller can decide to filter the row).
function costForModel(p, modelId) {
  const mp = p.modelPricing && p.modelPricing[modelId];
  if (!mp) return null;
  return { in: mp.listedIn, out: mp.listedOut, blended: (mp.listedIn + mp.listedOut) / 2 };
}

function CostCell({ p, modelId }) {
  // Prefer the active model's listed price; fall back to provider default
  const target = modelId ? costForModel(p, modelId) : null;
  const inP  = target ? target.in  : p.costIn;
  const outP = target ? target.out : p.costOut;
  return (
    <div className="flex items-baseline gap-1.5">
      <span className="num text-[14px] tracking-tight text-bone">{fmtUSD(inP)}</span>
      <span className="text-smoke text-[11px]">/</span>
      <span className="num text-[14px] text-bone">{fmtUSD(outP)}</span>
    </div>
  );
}

// Display label for an external website URL. GitHub hosts get path-aware
// labels (github.com/BerriAI/litellm); commercial domains drop the www.
function websiteLabel(website) {
  if (!website) return null;
  try {
    const u = new URL(website);
    if (u.hostname === 'github.com') return 'github.com' + u.pathname.replace(/\/$/, '');
    return u.hostname.replace(/^www\./, '');
  } catch { return website; }
}

// Clickable external link subtitle for a provider — used in ranking rows

// Hover/focus tooltip with click-to-toggle for touch. Pops above the trigger
// by default. Content can be a string or JSX. Width capped so long sentences
// still wrap nicely on narrow screens.
function Tooltip({ content, side = 'top', children, className = '', width = 240 }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const onEsc = (e) => e.key === 'Escape' && setOpen(false);
    document.addEventListener('keydown', onEsc);
    return () => document.removeEventListener('keydown', onEsc);
  }, [open]);
  return (
    <span
      className={cx('relative z-10 inline-flex items-center', className)}
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      onFocus={() => setOpen(true)}
      onBlur={() => setOpen(false)}
    >
      <span
        role="button"
        tabIndex={0}
        aria-label="Show explanation"
        onClick={(e) => { e.stopPropagation(); e.preventDefault(); setOpen(o => !o); }}
        className="inline-flex items-center justify-center text-smoke hover:text-bone cursor-help transition-colors"
      >
        {children}
      </span>
      {open && (
        <span
          role="tooltip"
          style={{ width }}
          className={cx(
            'absolute z-50 px-3 py-2 bg-ink-800 border border-ink-500 text-[11px] text-ash leading-relaxed shadow-lg whitespace-normal text-left normal-case tracking-normal',
            side === 'top'    && 'bottom-full left-1/2 -translate-x-1/2 mb-2',
            side === 'bottom' && 'top-full left-1/2 -translate-x-1/2 mt-2',
            side === 'left'   && 'right-full top-1/2 -translate-y-1/2 mr-2',
            side === 'right'  && 'left-full top-1/2 -translate-y-1/2 ml-2',
          )}
        >
          {content}
        </span>
      )}
    </span>
  );
}

function Sparkline({ data, color = 'currentColor', w = 80, h = 22 }) {
  if (!data?.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} className="block">
      <polyline points={pts} className="spark" stroke={color} />
    </svg>
  );
}

// Editorial-style 7d trend chart. Restraint-first design:
//   • Line + area fill is the headline; no Y-axis number tower.
//   • Header line carries the range (e.g. "348-350 ms") and updates with hover.
//   • Bottom shows only the time bounds ("7 天前" / "今日").
//   • Smooth Bezier (horizontal-tangent at each point) for editorial flow.
function TtftTrendChart({ data, color = 'rgb(var(--sky))' }) {
  const { t } = useLang();
  const [hoverIdx, setHoverIdx] = useState(null);
  if (!data?.length) return null;

  const valuesMs = data.map(s => Math.round(s * 1000));
  const min = Math.min(...valuesMs);
  const max = Math.max(...valuesMs);

  // SVG geometry. Tight padding — no axis labels means no bottom margin needed.
  const w = 540, h = 72;
  const padL = 4, padR = 4, padT = 8, padB = 6;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;

  // Add 30% of range as headroom (or +/-1ms if range = 0)
  const range = max - min;
  const yPad = range === 0 ? 1 : range * 0.3;
  const yMin = min - yPad;
  const yMax = max + yPad;
  const yRange = yMax - yMin || 1;

  const x = (i) => padL + (i / (data.length - 1)) * innerW;
  const y = (v) => padT + innerH - ((v - yMin) / yRange) * innerH;

  // Smooth Bezier path with horizontal tangents (clean editorial curves)
  const linePath = (() => {
    const pts = valuesMs.map((v, i) => [x(i), y(v)]);
    let d = `M ${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for (let i = 1; i < pts.length; i++) {
      const [px, py] = pts[i - 1];
      const [cx, cy] = pts[i];
      const midX = (px + cx) / 2;
      d += ` C ${midX.toFixed(2)},${py.toFixed(2)} ${midX.toFixed(2)},${cy.toFixed(2)} ${cx.toFixed(2)},${cy.toFixed(2)}`;
    }
    return d;
  })();
  const areaPath = `${linePath} L ${x(data.length - 1).toFixed(2)},${(padT + innerH).toFixed(2)} L ${padL.toFixed(2)},${(padT + innerH).toFixed(2)} Z`;

  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const xPos = ((e.clientX - rect.left) / rect.width) * w;
    const relX = xPos - padL;
    if (relX < -8 || relX > innerW + 8) { setHoverIdx(null); return; }
    const step = innerW / (data.length - 1);
    const idx = Math.max(0, Math.min(data.length - 1, Math.round(relX / step)));
    setHoverIdx(idx);
  };

  // Inline 11px monospace text — quiet, matches the page's `text-[11px] num` style
  const labelStyle = { fontSize: '11px', fontFamily: 'JetBrains Mono, ui-monospace, monospace', fontWeight: 400 };

  const daysAgo = (i) => data.length - 1 - i;
  const hoverLabel = hoverIdx === null ? null
    : daysAgo(hoverIdx) === 0 ? t('provider.trendToday')
    : t('provider.trendDaysAgo', { n: daysAgo(hoverIdx) });

  // Stable gradient id (per slug or hash if multiple charts on page — for our single use case, static is fine)
  const gradId = 'ttft-area-fill';

  return (
    <div>
      {/* Header line is purely hover-driven — empty (but reserves height to
          avoid layout shift) when no point is hovered. */}
      <div className="flex items-baseline justify-end mb-2 min-h-[16px]">
        {hoverIdx !== null && (
          <span className="text-[11px] num">
            <span className="text-smoke">{hoverLabel}</span>
            <span className="text-smoke px-1.5">·</span>
            <span className="text-bone">{valuesMs[hoverIdx]} ms</span>
          </span>
        )}
      </div>

      <svg
        viewBox={`0 0 ${w} ${h}`}
        className="block w-full"
        onMouseMove={onMove}
        onMouseLeave={() => setHoverIdx(null)}
      >
        <defs>
          <linearGradient id={gradId} x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%"   stopColor={color} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>

        {/* Subtle horizontal baseline (where data sits in middle) */}
        <line x1={padL} x2={w - padR}
          y1={padT + innerH - 0.5} y2={padT + innerH - 0.5}
          stroke="rgb(var(--ink-700))" strokeWidth="0.5"/>

        {/* Area fill under the curve */}
        <path d={areaPath} fill={`url(#${gradId})`}/>

        {/* Smooth trend line */}
        <path d={linePath}
          fill="none" stroke={color} strokeWidth="1.5"
          strokeLinecap="round" strokeLinejoin="round"/>

        {/* Hover: vertical guide + emphasized dot (no overlay tooltip — info is in header) */}
        {hoverIdx !== null && (() => {
          const cx_ = x(hoverIdx);
          const cy_ = y(valuesMs[hoverIdx]);
          return (
            <g>
              <line x1={cx_} x2={cx_} y1={padT} y2={padT + innerH}
                stroke={color} strokeDasharray="2,3" opacity="0.4"/>
              <circle cx={cx_} cy={cy_} r="3.5"
                fill="rgb(var(--paper))" stroke={color} strokeWidth="1.5"/>
            </g>
          );
        })()}
      </svg>
    </div>
  );
}

// Animated number that eases up from 0 to `target` on mount.
// Used in the Hero credibility strip to make the stats feel live.
function CountUp({ target, duration = 1100, format = (n) => n.toLocaleString() }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      setN(Math.round(target * e));
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return <span className="num text-bone">{format(n)}</span>;
}

function ProviderFallback({ text, size }) {
  return (
    <div
      className="flex items-center justify-center serif shrink-0 bg-ink-700 text-bone"
      style={{ width: size, height: size, fontSize: size * 0.5 }}
    >
      {text}
    </div>
  );
}

function ProviderMark({ slug, size = 36 }) {
  const p = PROVIDERS.find(x => x.slug === slug);
  const [failed, setFailed] = useState(false);

  if (!p) return <ProviderFallback text="?" size={size}/>;

  // Clearbit returns transparent PNGs; sit them on a small white plate so
  // brand color reads against either dark or light theme.
  if (p.domain && !failed) {
    return (
      <img
        src={`https://logo.clearbit.com/${p.domain}`}
        alt={p.name}
        width={size}
        height={size}
        loading="lazy"
        onError={() => setFailed(true)}
        className="shrink-0 rounded-sm bg-white object-contain"
        style={{ width: size, height: size, padding: Math.max(2, size * 0.06) }}
      />
    );
  }

  if (PROVIDER_SVG[slug]) {
    return (
      <span
        className="shrink-0 inline-flex items-center justify-center"
        style={{ width: size, height: size }}
        aria-label={p.name}
      >
        {PROVIDER_SVG[slug]}
      </span>
    );
  }

  return <ProviderFallback text={p.name[0]} size={size}/>;
}

function TrustBar({ value }) {
  const tone = trustTone(value);
  const c = { brand: 'bg-brand', amber: 'bg-amber', coral: 'bg-coral' }[tone];
  return (
    <div className="mt-1.5 h-px bg-ink-500 relative overflow-hidden" style={{ width: 100 }}>
      <div className={cx('absolute inset-y-0 left-0', c)} style={{ width: `${value}%` }}></div>
    </div>
  );
}

function Dropdown({ label, value, options, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);
  return (
    <div className="relative" ref={ref}>
      <button onClick={()=>setOpen(!open)} className="flex items-center gap-2 px-3 py-1.5 text-[12px] border border-ink-500 hover:border-bone transition-colors">
        <span className="micro text-smoke">{label}</span>
        <span className="text-bone">{value}</span>
        <svg viewBox="0 0 12 12" className="w-2.5 h-2.5 text-ash"><path d="M3 5l3 3 3-3" stroke="currentColor" fill="none" strokeWidth="1.25"/></svg>
      </button>
      {open && (
        <div className="absolute top-full left-0 mt-1 w-48 card z-30 py-1">
          {options.map(o => (
            <button key={o.v} onClick={()=>{onChange(o.v); setOpen(false);}} className="w-full text-left px-3 py-2 text-[12px] text-ash hover:bg-ink-700 hover:text-bone transition-colors">
              {o.l}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function RangeInput({ min, max, step = 1, value, onChange, disabled = false }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <input
      type="range"
      min={min}
      max={max}
      step={step}
      value={value}
      disabled={disabled}
      onChange={e => onChange(+e.target.value)}
      className="range-brand"
      style={{ '--pct': `${pct}%` }}
    />
  );
}

  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onClick);

  useEffect(() => { if (disabled) setOpen(false); }, [disabled]);

        disabled={disabled}

          'w-full flex items-center justify-between gap-2 bg-ink-800 border px-3 py-2 text-[13px] text-bone transition-colors',
          disabled ? 'border-ink-500 opacity-60 cursor-not-allowed' : open ? 'border-brand/60' : 'border-ink-500 hover:border-bone'
        )}
      >
        <span className="truncate">

          {showOwner && <span className="text-smoke"> · {current.owner}</span>}

        <svg viewBox="0 0 12 12" className={cx('w-2.5 h-2.5 text-ash shrink-0 transition-transform', open && 'rotate-180')}>
          <path d="M3 5l3 3 3-3" stroke="currentColor" fill="none" strokeWidth="1.25"/>

// Chat-first multi-provider playground. Each user message fans out to the
// currently-active provider set; responses render as a side-by-side row inline
// in the conversation thread. Per-response thumbs feedback. No batched
// "comparison run" object — the thread itself is the comparison.
function RunPage() {
  const { t } = useLang();
  const { route } = useRouter();
  const toast = useToast();

  // URL params decide the initial active set:
  //   ?provider=X        → just that one
  //   ?providers=X,Y,Z   → multi
  // Legacy ?strategy=...  → resolve to that slug
  const initialActive = useMemo(() => {
    const single = route.params.provider;
    const multi = (route.params.providers || '').split(',').filter(Boolean);
    const strat = route.params.strategy;
    if (strat === 'cheapest') return [[...PROVIDERS].sort((a, b) => a.cost - b.cost)[0].slug];
    if (strat === 'trusted')  return [[...PROVIDERS].sort((a, b) => b.trust - a.trust)[0].slug];
    if (strat === 'overall')  return [[...PROVIDERS].sort((a, b) => b.overall - a.overall)[0].slug];
    if (single) return [single];
    if (multi.length >= 1) return multi.slice(0, 5);
    // Default set should all support the default model (openai/gpt-5.5),
    // otherwise the model-filter useEffect strips most of them on mount.
    return ['portkey', 'openrouter', 'aimlapi'];
  }, []);

  // Initial model also inherits from URL ?model= (e.g. when arriving from a
  // provider detail page's CTA). Falls back to GPT-5.5 default.
  const [model, setModel] = useState(() => {
    const urlModel = route.params.model;
    if (urlModel && MODELS.some(mm => mm.id === urlModel)) return urlModel;
    return 'openai/gpt-5.5';
  });
  const [activeProviders, setActiveProviders] = useState(initialActive);
  const [temperature, setTemperature] = useState(0);
  const [maxTokens, setMaxTokens] = useState(1024);
  const [systemPrompt, setSystemPrompt] = useState('');
  const [messages, setMessages] = useState([]);
  const [compose, setCompose] = useState('');
  const [showParams, setShowParams] = useState(false);
  const [showPickerModal, setShowPickerModal] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  // Editing state for the "edit last user message" flow
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState('');
  const composeRef = useRef(null);
  const threadBottomRef = useRef(null);
  // Anchor on the latest user message — used to scroll it to the top of the
  // viewport after submit (ChatGPT-style: your new prompt parks at the top,
  // the assistant streams down below). MessageList attaches this ref to the
  // very last UserBubble.
  const latestUserAnchorRef = useRef(null);
  // Track every in-flight setTimeout per turn so Stop / Regenerate / Edit
  // can cancel them before they fire and mutate state.
  const pendingTimersRef = useRef({});

  // Any response still in flight (pending or running) blocks compose
  const inFlight = useMemo(
    () => messages.some(m => m.role === 'assistant' && m.responses.some(r => r.status === 'pending' || r.status === 'running')),
    [messages]
  );

  // Providers that support the currently-selected model. Anyone in
  // activeProviders that doesn't support the new model gets dropped
  // when the user switches model.
  const supportedSlugs = useMemo(
    () => new Set(PROVIDERS.filter(p => p.modelPricing && p.modelPricing[model]).map(p => p.slug)),
    [model]
  );
  useEffect(() => {
    const filtered = activeProviders.filter(s => supportedSlugs.has(s));
    if (filtered.length === activeProviders.length) return;
    const padded = filtered.length === 0 && supportedSlugs.size > 0
      ? [Array.from(supportedSlugs)[0]]
      : filtered;
    setActiveProviders(padded);
  }, [model]); // eslint-disable-line react-hooks/exhaustive-deps

  // ChatGPT-style scroll: when a new turn is added, scroll the new user
  // message to the TOP of the viewport (just below the sticky bars). The
  // assistant cards stream down below it. Uses scroll-margin-top on the
  // bubble to clear the global header + Run top bar.
  useEffect(() => {
    if (latestUserAnchorRef.current) {
      latestUserAnchorRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [messages.length]);

  // Register a timer in the per-turn registry so stop() / regenerate() can cancel it.
  const trackTimer = (turnId, id) => {
    (pendingTimersRef.current[turnId] ??= []).push(id);
  };

  // Launch a single provider's response for a turn. Sets `running` after
  // a stagger, then `completed` or `failed` after a deterministic jitter.
  // All setTimeout IDs are recorded in pendingTimersRef so Stop can cancel them.
  const launchResponse = (turnId, slug, idx, userText) => {
    const startDelay = 80 + idx * 200;
    const t1 = setTimeout(() => {
      setMessages(prev => prev.map(m =>
        m.role === 'assistant' && m.turnId === turnId
          ? { ...m, responses: m.responses.map(r =>
              // Don't flip cancelled responses to running (Stop hit before this fired)
              r.slug === slug && r.status !== 'cancelled' ? { ...r, status: 'running' } : r
            )}
          : m
      ));
    }, startDelay);
    trackTimer(turnId, t1);

    const finishDelay = startDelay + 900 + (strHash(slug + turnId) % 1500);
    const t2 = setTimeout(() => {
      const provider = PROVIDERS.find(x => x.slug === slug);
      const failProb = slug === 'replicate' ? 0.45 : slug === 'anyscale' ? 0.08 : 0.0;
      const fail = (strHash(slug + turnId + 'f') % 100) / 100 < failProb;
      const inputTokens = Math.max(40, Math.round(userText.length / 4));
      const baseOut = 280 + (strHash(slug + turnId + 'o') % 480);
      const outputTokens = Math.round(baseOut * (PROVIDER_STYLE[slug]?.verbosity ?? 1));
      const cost = tokenCost(provider, inputTokens, outputTokens);
      const latJit = ((strHash(slug + turnId + 'l') % 100) - 50) / 200;
      const ttftJit = ((strHash(slug + turnId + 't') % 100) - 50) / 500;
      setMessages(prev => prev.map(m =>
        m.role === 'assistant' && m.turnId === turnId
          ? { ...m, responses: m.responses.map(r => {
              // If response was cancelled before completion, keep cancelled state
              if (r.slug !== slug || r.status === 'cancelled') return r;
              return {
                ...r,
                status: fail ? 'failed' : 'completed',
                latency: Math.max(0.3, provider.latency + latJit),
                ttft: Math.max(0.1, provider.ttft + ttftJit),
                cost: fail ? null : cost,
                inputTokens, outputTokens,
                content: fail ? null : getMockResponse(userText, slug),
                error: fail ? 'Timeout after 30s · cold start on shared GPU' : null,
              };
            })}
          : m
      ));
    }, finishDelay);
    trackTimer(turnId, t2);
  };

  const submit = () => {
    const text = compose.trim();
    if (!text || inFlight || activeProviders.length === 0) return;
    const turnId = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const userMsg = { id: `u_${turnId}`, role: 'user', ts: Date.now(), content: text };
    const assistantMsg = {
      id: `a_${turnId}`,
      role: 'assistant',
      ts: Date.now(),
      turnId,
      responses: activeProviders.map(slug => ({ slug, status: 'pending', thumb: null })),
    };
    setMessages(prev => [...prev, userMsg, assistantMsg]);
    setCompose('');
    activeProviders.forEach((slug, idx) => launchResponse(turnId, slug, idx, text));
  };

  const retry = (turnId, slug) => {
    // Recover the user text that produced this turn, then re-launch only
    // that provider (others stay intact).
    const aIdx = messages.findIndex(m => m.role === 'assistant' && m.turnId === turnId);
    if (aIdx < 1) return;
    const userText = messages[aIdx - 1]?.content || '';
    setMessages(prev => prev.map(m =>
      m.role === 'assistant' && m.turnId === turnId
        ? { ...m, responses: m.responses.map(r => r.slug === slug ? { slug, status: 'pending', thumb: null } : r) }
        : m
    ));
    setTimeout(() => launchResponse(turnId, slug, 0, userText), 50);
  };

  const setThumb = (turnId, slug, thumb) => {
    setMessages(prev => prev.map(m =>
      m.role === 'assistant' && m.turnId === turnId
        ? { ...m, responses: m.responses.map(r => r.slug === slug ? { ...r, thumb: r.thumb === thumb ? null : thumb } : r) }
        : m
    ));
  };

  const resetChat = () => {
    // Cancel any in-flight timers so they don't fire into the cleared thread
    Object.values(pendingTimersRef.current).flat().forEach(clearTimeout);
    pendingTimersRef.current = {};
    setMessages([]);
    setShowResetConfirm(false);
    setEditingId(null);
    setEditDraft('');
    setTimeout(() => composeRef.current?.focus(), 50);
  };

  // Stop — cancel every pending / running response across the thread.
  // Preserves already-completed cards.
  const stop = () => {
    Object.values(pendingTimersRef.current).flat().forEach(clearTimeout);
    pendingTimersRef.current = {};
    setMessages(prev => prev.map(m =>
      m.role !== 'assistant'
        ? m
        : { ...m, responses: m.responses.map(r =>
            (r.status === 'pending' || r.status === 'running')
              ? { ...r, status: 'cancelled', error: 'Cancelled' }
              : r
          )}
    ));
  };

  // Regenerate a specific assistant turn — re-roll it AND truncate everything
  // after it (consistent with edit behavior). Uses the current activeProviders
  // (not the original turn's slugs) so the user can swap providers and re-roll.
  // Truncating future turns avoids logical inconsistency where later turns
  // depended on the old response content.
  const regenerateTurn = (targetTurnId) => {
    if (inFlight) return;
    const aIdx = messages.findIndex(m => m.role === 'assistant' && m.turnId === targetTurnId);
    if (aIdx < 1) return;
    const userText = messages[aIdx - 1]?.content || '';
    if (!userText) return;
    // Clear ALL pending timers (we're truncating, so any in-flight for now-
    // discarded turns shouldn't fire either). Edit/regenerate buttons are
    // disabled when inFlight so this set is normally empty, but be defensive.
    Object.values(pendingTimersRef.current).flat().forEach(clearTimeout);
    pendingTimersRef.current = {};
    const turnId = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    // Truncate everything past this assistant turn; replace this turn with
    // fresh pending responses; keep user msg unchanged.
    setMessages(prev => {
      const truncated = prev.slice(0, aIdx + 1);
      return truncated.map((m, i) =>
        i === aIdx
          ? { ...m, ts: Date.now(), turnId, responses: activeProviders.map(slug => ({ slug, status: 'pending', thumb: null })) }
          : m
      );
    });
    activeProviders.forEach((slug, idx) => launchResponse(turnId, slug, idx, userText));
  };

  // Edit last user message — enter edit mode by saving the message id + draft.
  const startEdit = (msg) => {
    if (inFlight) return;
    setEditingId(msg.id);
    setEditDraft(msg.content);
  };
  const cancelEdit = () => {
    setEditingId(null);
    setEditDraft('');
  };
  // Resubmit: truncate everything from the edited message onward, then fan out
  // a fresh turn with the new text. Discards all subsequent assistant responses.
  const resubmitEdit = () => {
    const text = editDraft.trim();
    if (!text) return;
    const idx = messages.findIndex(m => m.id === editingId);
    if (idx < 0) return;
    // Cancel any in-flight timers (defensive — shouldn't have any since inFlight blocks edit)
    Object.values(pendingTimersRef.current).flat().forEach(clearTimeout);
    pendingTimersRef.current = {};
    const truncated = messages.slice(0, idx);
    const turnId = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const userMsg = { id: `u_${turnId}`, role: 'user', ts: Date.now(), content: text };
    const assistantMsg = {
      id: `a_${turnId}`,
      role: 'assistant',
      ts: Date.now(),
      turnId,
      responses: activeProviders.map(slug => ({ slug, status: 'pending', thumb: null })),
    };
    setMessages([...truncated, userMsg, assistantMsg]);
    setEditingId(null);
    setEditDraft('');
    activeProviders.forEach((slug, i) => launchResponse(turnId, slug, i, text));
  };

  // Cmd+Enter (anywhere) → submit current compose
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [compose, activeProviders, inFlight]); // eslint-disable-line react-hooks/exhaustive-deps

  const turnCount = useMemo(() => messages.filter(m => m.role === 'user').length, [messages]);

  return (
    <Fragment>
      {/* TOP BAR — model picker, provider chips, params, reset */}
      {/* Top bar sticky just below the global header so model + provider
          context is always visible while scrolling the chat. z-30 sits below
          the global Header (z-40) but above thread content. */}
      <section className="sticky top-16 z-30 border-b border-ink-600 bg-ink/85 backdrop-blur-md">
        <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3 flex-wrap min-w-0">
            <div className="shrink-0">
              <div className="micro text-smoke">{t('run.tool')}</div>
              <div className="text-bone tracking-tight text-[14px] -mt-0.5">{t('run.chatTitle')}</div>
            </div>
            <div className="h-8 w-px bg-ink-600 hidden sm:block shrink-0"/>
            <div className="shrink-0">
              {/* Use the shared Dropdown component for visual parity with the
                  home page Ranking section — label is embedded inside the
                  button (no external micro label above). */}
              <Dropdown
                label={t('run.topbarModelLabel')}
                value={MODELS.find(m => m.id === model)?.display || model}
                options={MODELS.map(m => ({ v: m.id, l: m.display }))}
                onChange={setModel}
              />
            </div>
            <div className="shrink-0">
              <button
                onClick={() => setShowPickerModal(true)}
                disabled={inFlight}
                className="px-3 py-1.5 text-[12px] border border-ink-500 hover:border-bone text-bone inline-flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
              >
                <span className="micro text-smoke">{t('run.topbarProvidersLabel')}</span>
                {/* Stack of mini provider marks — sized below the text line
                    height (14px < ~16px text leading) so the marks don't push
                    the button taller than the Dropdown next to it */}
                <span className="flex -space-x-1">
                  {activeProviders.slice(0, 4).map(slug => (
                    <span key={slug} className="ring-1 ring-ink-800 inline-block leading-none">
                      <ProviderMark slug={slug} size={14}/>
                    </span>
                  ))}
                  {activeProviders.length > 4 && (
                    <span className="w-3.5 h-3.5 ring-1 ring-ink-800 bg-ink-700 flex items-center justify-center text-[8px] num text-ash">
                      +{activeProviders.length - 4}
                    </span>
                  )}
                </span>
                <span className="num">{activeProviders.length}</span>
                <svg viewBox="0 0 12 12" className="w-2.5 h-2.5 text-ash">
                  <path d="M3 5l3 3 3-3" stroke="currentColor" fill="none" strokeWidth="1.25"/>
                </svg>
              </button>
            </div>
          </div>
          <div className="flex items-center gap-1.5">
            <button
              onClick={() => setShowParams(true)}
              className="text-smoke hover:text-bone p-2 transition-colors"
              title={t('run.paramsLabel')}
            >
              <I.sliders className="w-4 h-4"/>
            </button>
            <button
              onClick={() => messages.length === 0 ? null : setShowResetConfirm(true)}
              disabled={messages.length === 0}
              className="px-3 py-1.5 text-[12px] border border-ink-500 hover:border-bone/40 text-ash hover:text-bone inline-flex items-center gap-1.5 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
            >
              <I.refresh className="w-3.5 h-3.5"/> {t('run.newChat')}
            </button>
          </div>
        </div>
      </section>

      {/* Empty state: compose embedded in centered hero (Arena-style).
          Active state: thread + sticky-bottom compose that stays put as new
          responses stream in (doesn't drift with output). */}
      {messages.length === 0 ? (
        <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8">
          <EmptyChatHero
            onPick={(p) => { setCompose(p); composeRef.current?.focus(); }}
            providerCount={activeProviders.length}
            activeProviders={activeProviders}
            composeNode={
              <ComposeBox
                value={compose}
                onChange={setCompose}
                onSubmit={submit}
                onStop={stop}
                inFlight={inFlight}
                disabled={activeProviders.length === 0}
                disabledReason={
                  activeProviders.length === 0 ? t('run.composeNoProviders') : null
                }
                inputRef={composeRef}
                providerCount={activeProviders.length}
              />
            }
          />
        </div>
      ) : (
        <Fragment>
          <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-32">
            <MessageList
              messages={messages}
              onThumb={setThumb}
              onRetry={retry}
              onRegenerate={regenerateTurn}
              canRegenerate={!inFlight}
              editingId={editingId}
              editDraft={editDraft}
              onEditDraftChange={setEditDraft}
              onStartEdit={startEdit}
              onCancelEdit={cancelEdit}
              onSubmitEdit={resubmitEdit}
              canEdit={!inFlight}
              latestUserAnchorRef={latestUserAnchorRef}
            />
            <div ref={threadBottomRef}/>
          </div>
          {/* Fixed-bottom compose once conversation started — pinned to the
              viewport, not the document flow. Stays in place regardless of
              how much / how little content is above it. Thread area has pb-32
              padding so the last message isn't hidden behind it. */}
          <div className="fixed bottom-0 left-0 right-0 z-20 bg-ink/95 backdrop-blur-md border-t border-ink-600">
            <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <ComposeBox
                value={compose}
                onChange={setCompose}
                onSubmit={submit}
                onStop={stop}
                inFlight={inFlight}
                disabled={activeProviders.length === 0}
                disabledReason={
                  activeProviders.length === 0 ? t('run.composeNoProviders') : null
                }
                inputRef={composeRef}
                providerCount={activeProviders.length}
              />
            </div>
          </div>
        </Fragment>
      )}

      {/* New-chat confirm modal */}
      {showResetConfirm && (
        <Modal onClose={() => setShowResetConfirm(false)} size="md">
          <h3 className="serif text-2xl tracking-editorial mb-3">{t('run.newChatConfirmTitle')}</h3>
          <p className="text-[13px] text-ash leading-relaxed mb-6">
            {t('run.newChatConfirmBody', { n: turnCount })}
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setShowResetConfirm(false)} className="btn-ghost px-4 py-2 text-[12px]">
              {t('run.newChatConfirmKeep')}
            </button>
            <button onClick={resetChat} className="btn-brand px-4 py-2 text-[12px]">
              {t('run.newChatConfirmReset')}
            </button>
          </div>
        </Modal>
      )}

      {/* Generation params modal */}
      {showParams && (
        <Modal onClose={() => setShowParams(false)} size="md">
          <h3 className="serif text-2xl tracking-editorial mb-2">{t('run.paramsModalTitle')}</h3>
          <p className="micro text-smoke mb-6">{t('run.paramsChangesHint')}</p>
          <div className="space-y-6">
            <div>
              <div className="micro text-smoke mb-2">{t('run.temperature')}</div>
              <div className="grid grid-cols-[1fr_56px] items-center gap-3">
                <RangeInput min={0} max={2} step={0.1} value={temperature} onChange={setTemperature}/>
                <span className="num text-bone text-right">{temperature.toFixed(1)}</span>
              </div>
            </div>
            <div>
              <div className="micro text-smoke mb-2">{t('run.maxTokens')}</div>
              <div className="grid grid-cols-[1fr_56px] items-center gap-3">
                <RangeInput min={128} max={4096} step={128} value={maxTokens} onChange={setMaxTokens}/>
                <span className="num text-bone text-right">{maxTokens}</span>
              </div>
            </div>
            <div>
              <div className="micro text-smoke mb-2">{t('run.systemPromptLabel')}</div>
              <textarea
                value={systemPrompt}
                onChange={e => setSystemPrompt(e.target.value)}
                rows={4}
                placeholder={t('run.systemPromptPlaceholder')}
                className="w-full bg-ink-800 border border-ink-500 focus:border-brand/60 outline-none p-3 text-[13px] resize-none text-bone leading-relaxed"
              />
            </div>
          </div>
        </Modal>
      )}

      {/* Providers picker modal */}
      {showPickerModal && (() => {
        const modelDisplay = MODELS.find(m => m.id === model)?.display || model;
        const supported = PROVIDERS.filter(p => supportedSlugs.has(p.slug));
        const unsupported = PROVIDERS.filter(p => !supportedSlugs.has(p.slug));
        const renderRow = (p) => {
          const on = activeProviders.includes(p.slug);
          const isSupp = supportedSlugs.has(p.slug);
          return (
            <button
              key={p.slug}
              onClick={() => {
                if (!isSupp) return;
                if (on) {
                  if (activeProviders.length === 1) return;
                  setActiveProviders(activeProviders.filter(x => x !== p.slug));
                } else if (activeProviders.length < 5) {
                  setActiveProviders([...activeProviders, p.slug]);
                } else {
                  toast.show(t('run.max5Providers'));
                }
              }}
              disabled={!isSupp}
              title={!isSupp ? t('run.providersUnsupportedByModel', { model: modelDisplay }) : ''}
              className={cx(
                'w-full flex items-center gap-3 px-3 py-2 border transition-colors text-left',
                on ? 'border-brand/60 bg-brand/5' : 'border-ink-600 hover:border-bone/30',
                !isSupp && 'opacity-50 cursor-not-allowed'
              )}
            >
              <span className={cx('check', on && 'on')}>{on && <I.check className="w-2.5 h-2.5 text-ink"/>}</span>
              <ProviderMark slug={p.slug}/>
              <div className="flex-1 min-w-0">
                <div className="text-[13px] text-bone truncate">{p.name}</div>
                <div className="micro text-smoke">{p.type}</div>
              </div>
              {isSupp
                ? <TrustBadge score={p.trust}/>
                : <span className="text-[11px] text-amber italic shrink-0">{t('run.providersUnsupportedByModel', { model: modelDisplay })}</span>
              }
            </button>
          );
        };
        return (
          <Modal onClose={() => setShowPickerModal(false)} size="md">
            <h3 className="serif text-2xl tracking-editorial mb-2">{t('run.providersPickerLabel')}</h3>
            <p className="micro text-smoke mb-2">{t('run.providersChangesHint')}</p>
            {unsupported.length > 0 && (
              <p className="text-[12px] text-amber mb-4 flex items-start gap-1.5 leading-relaxed">
                <I.info className="w-3.5 h-3.5 mt-0.5 shrink-0"/>
                <span>{t('run.providersFilterHint', { n: unsupported.length, model: modelDisplay })}</span>
              </p>
            )}
            <div className="space-y-1">{supported.map(renderRow)}</div>
            {unsupported.length > 0 && (
              <Fragment>
                <div className="mt-4 mb-2 micro text-smoke">{t('run.providersUnsupportedSection')}</div>
                <div className="space-y-1">{unsupported.map(renderRow)}</div>
              </Fragment>
            )}
            <div className="mt-5 flex justify-end">
              <button onClick={() => setShowPickerModal(false)} className="btn-brand px-4 py-2 text-[12px]">
                {t('run.providersClose')}
              </button>
            </div>
          </Modal>
        );
      })()}
    </Fragment>
  );
}

// Arena-style empty state — vertically centered title, embedded compose,
// minimal type-only chips below. Compose lives here when no messages exist,
// then migrates to a sticky-bottom slot once the conversation starts.
function EmptyChatHero({ onPick, providerCount, activeProviders = [], composeNode }) {
  const { t } = useLang();
  return (
    <div className="min-h-[calc(100vh-180px)] flex items-center justify-center py-12">
      <div className="w-full max-w-3xl">
        <h2 className="serif text-3xl sm:text-4xl lg:text-5xl tracking-editorial text-center mb-3">
          {t('run.emptyHeroTitle')}
        </h2>
        {activeProviders.length > 0 ? (
          <div className="flex items-center justify-center gap-2 flex-wrap text-[12px] text-ash mb-8">
            <span className="text-smoke">{t('run.emptyDestinationLabel')}</span>
            {activeProviders.map((slug, i) => {
              const p = PROVIDERS.find(x => x.slug === slug);
              if (!p) return null;
              return (
                <Fragment key={slug}>
                  <span className="inline-flex items-center gap-1.5">
                    <ProviderMark slug={slug} size={16}/>
                    <span className="text-bone">{p.name}</span>
                  </span>
                  {i < activeProviders.length - 1 && <span className="text-smoke">·</span>}
                </Fragment>
              );
            })}
          </div>
        ) : (
          <p className="text-[12px] text-amber text-center mb-8">
            {t('run.composeNoProviders')}
          </p>
        )}
        {composeNode}
        <div className="mt-8 flex flex-wrap gap-1.5 justify-center">
          {BENCHMARK_TEMPLATES.map(tpl => {
            const localized = t('run.tplPrompts.' + tpl.id) || tpl.prompt;
            return (
              <button
                key={tpl.id}
                onClick={() => onPick(localized)}
                className="px-3 py-1.5 text-[12px] border border-ink-500 hover:border-brand hover:text-brand text-ash transition-colors"
              >
                {t('run.tpl' + tpl.id.charAt(0).toUpperCase() + tpl.id.slice(1))}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// MessageList — top-to-bottom render of user bubbles + assistant rows.
// Last assistant row gets the Regenerate button; last user msg is editable.
function MessageList({
  messages, onThumb, onRetry,
  onRegenerate, canRegenerate,
  editingId, editDraft, onEditDraftChange, onStartEdit, onCancelEdit, onSubmitEdit, canEdit,
  latestUserAnchorRef,
}) {
  // Index of the last assistant message (for Regenerate button)
  const lastAssistantId = useMemo(() => {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'assistant') return messages[i].id;
    }
    return null;
  }, [messages]);
  // Index of the last user message (for Edit button)
  const lastUserId = useMemo(() => {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return messages[i].id;
    }
    return null;
  }, [messages]);

  return (
    <div className="space-y-6">
      {messages.map(m =>
        m.role === 'user'
          ? <UserBubble
              key={m.id}
              msg={m}
              isLast={m.id === lastUserId}
              canEdit={canEdit}
              isEditing={editingId === m.id}
              editDraft={editDraft}
              onEditDraftChange={onEditDraftChange}
              onStartEdit={onStartEdit}
              onCancelEdit={onCancelEdit}
              onSubmitEdit={onSubmitEdit}
              anchorRef={m.id === lastUserId ? latestUserAnchorRef : null}
            />
          : <AssistantRow
              key={m.id}
              row={m}
              onThumb={onThumb}
              onRetry={onRetry}
              isLast={m.id === lastAssistantId}
              onRegenerate={onRegenerate}
              canRegenerate={canRegenerate}
            />
      )}
      {/* "Clear screen" spacer · enables ChatGPT-style scroll behavior:
          guarantees ~1 viewport of empty space below the latest content so
          scrolling the new user message to viewport-top is always possible.
          Without this, short conversations (1-2 turns) wouldn't have enough
          scrollable area to push earlier content off-screen. */}
      {messages.length > 0 && (
        <div aria-hidden="true" style={{ minHeight: 'calc(100vh - 320px)' }}/>
      )}
    </div>
  );
}

// User message — right-aligned bubble (chat convention: user on right).
// Last user msg gets an Edit button on hover; clicking enters an inline edit
// mode (textarea + Cancel/Resubmit). Resubmit truncates all subsequent turns
// and re-fans-out a fresh turn with the new content.
function UserBubble({
  msg, isLast, canEdit,
  isEditing, editDraft, onEditDraftChange, onStartEdit, onCancelEdit, onSubmitEdit,
  anchorRef,
}) {
  const { t } = useLang();
  const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  // Edit affordance now available on ANY user message (not just the last).
  // Resubmit will truncate everything after this message, consistent with
  // single-branch chat history semantics.
  const showEditAffordance = canEdit && !isEditing;
  // scroll-margin-top accounts for global Header (64px) + Run top bar (~60px)
  // so when this bubble is scrolled-into-view it sits below them, not under them.
  const scrollPadStyle = { scrollMarginTop: '140px' };

  if (isEditing) {
    return (
      <div ref={anchorRef} style={scrollPadStyle} className="flex justify-end">
        <div className="w-full max-w-[90%] sm:max-w-[80%] md:max-w-[70%]">
          <textarea
            value={editDraft}
            onChange={e => onEditDraftChange(e.target.value)}
            onKeyDown={(e) => {
              if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); onSubmitEdit(); }
              if (e.key === 'Escape') onCancelEdit();
            }}
            autoFocus
            rows={3}
            className="w-full bg-ink-800 border border-brand/60 outline-none p-3 text-[14px] resize-y text-bone leading-relaxed"
            style={{ minHeight: 72 }}
          />
          <div className="mt-2 flex items-center justify-end gap-2">
            <button onClick={onCancelEdit} className="btn-ghost px-3 py-1.5 text-[12px]">
              {t('run.editCancel')}
            </button>
            <button
              onClick={onSubmitEdit}
              disabled={!editDraft.trim()}
              className="btn-brand px-3 py-1.5 text-[12px] inline-flex items-center gap-1.5 disabled:opacity-40"
            >
              <I.refresh className="w-3 h-3"/> {t('run.editResubmit')}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div ref={anchorRef} style={scrollPadStyle} className="flex justify-end group">
      <div className="max-w-[90%] sm:max-w-[70%] md:max-w-[60%]">
        <div className="micro text-smoke mb-1 text-right flex items-center justify-end gap-2">
          {showEditAffordance && (
            <button
              onClick={() => onStartEdit(msg)}
              className="opacity-0 group-hover:opacity-100 transition-opacity text-smoke hover:text-bone inline-flex items-center gap-1"
              title={t('run.editBtn')}
            >
              <I.refresh className="w-3 h-3"/>
              <span className="micro">{t('run.editBtn')}</span>
            </button>
          )}
          <span>{t('run.youLabel')} · {time}</span>
        </div>
        <div className="bg-ink-700/60 border border-ink-500 px-4 py-2.5 text-bone text-[14px] leading-relaxed whitespace-pre-wrap">
          {msg.content}
        </div>
      </div>
    </div>
  );
}

// AssistantRow — one assistant turn = N response cards in a responsive grid.
// Regenerate button available on ANY assistant row (not just the last); it
// re-rolls that specific turn and truncates everything after — consistent
// with the edit-resubmit semantic.
function AssistantRow({ row, onThumb, onRetry, isLast, onRegenerate, canRegenerate }) {
  const { t } = useLang();
  const n = row.responses.length;
  const gridCls = n === 1 ? 'grid-cols-1'
                : n === 2 ? 'grid-cols-1 md:grid-cols-2'
                : n === 3 ? 'grid-cols-1 md:grid-cols-3'
                :           'grid-cols-1 md:grid-cols-2 lg:grid-cols-3';
  const allDone = row.responses.every(r => r.status === 'completed' || r.status === 'failed' || r.status === 'cancelled');
  const showRegenerate = canRegenerate && allDone;
  return (
    <div>
      <div className={cx('grid gap-3', gridCls)}>
        {row.responses.map(r => (
          <ResponseCard
            key={r.slug}
            r={r}
            turnId={row.turnId}
            onThumb={onThumb}
            onRetry={onRetry}
          />
        ))}
      </div>
      {showRegenerate && (
        <div className="mt-2 flex justify-end">
          <button
            onClick={() => onRegenerate(row.turnId)}
            className="px-3 py-1.5 text-[11px] border border-ink-500 hover:border-bone/40 text-ash hover:text-bone inline-flex items-center gap-1.5 transition-colors"
            title={isLast ? t('run.regenerateBtn') : t('run.regenerateBtnOlder')}
          >
            <I.refresh className="w-3 h-3"/> {t('run.regenerateBtn')}
          </button>
        </div>
      )}
    </div>
  );
}

// ResponseCard — single provider's response within an assistant turn.
// Pending / running / completed / failed states; inline thumbs + copy + retry.
// MarkdownBody — renders text as parsed markdown using the global `marked`.
// Falls back to plain pre if `marked` isn't loaded (e.g. CDN failure).
// dangerouslySetInnerHTML is safe here because marked v11 escapes raw HTML
// by default (no `html: true` flag) and content comes from our own mock
// response generator. When wiring real provider output, ensure server-side
// sanitization or switch to a sanitizer like DOMPurify.
function MarkdownBody({ text }) {
  const html = useMemo(() => {
    if (!text) return '';
    if (typeof window === 'undefined' || !window.marked) {
      return null; // signal: render fallback
    }
    try {
      return window.marked.parse(text, { breaks: true, gfm: true });
    } catch {
      return null;
    }
  }, [text]);

  if (html === null) {
    return (
      <pre className="whitespace-pre-wrap text-[12.5px] leading-relaxed text-bone font-mono">{text}</pre>
    );
  }
  return <div className="md-body" dangerouslySetInnerHTML={{ __html: html }}/>;
}

function ResponseCard({ r, turnId, onThumb, onRetry }) {
  const { t } = useLang();
  const toast = useToast();
  const p = PROVIDERS.find(x => x.slug === r.slug);
  const responseText = r.status === 'completed' ? (r.content || '') : '';
  const stream = useStreamingText(responseText, 14);

  const phaseLabel = {
    pending: t('run.phaseQueued'),
    running: t('run.phaseStreaming'),
    completed: t('run.phaseComplete'),
    failed: t('run.phaseFailed'),
    cancelled: t('run.phaseCancelled'),
  }[r.status];

  const onCopy = () => {
    if (!r.content) return;
    copyToClipboard(r.content);
    toast.show(t('run.copiedResponse', { name: p.name }));
  };

  return (
    <div className="card p-4 flex flex-col">
      {/* Header strip — provider mark + phase pill + trust */}
      <div className="flex items-center justify-between gap-2 pb-3 border-b border-ink-600">
        <div className="flex items-center gap-2.5 min-w-0">
          <ProviderMark slug={r.slug} size={28}/>
          <div className="min-w-0">
            <div className="text-[13px] text-bone truncate">{p.name}</div>
            <div className="micro text-smoke flex items-center gap-1.5">
              {r.status === 'running' && <span className="w-1.5 h-1.5 bg-brand rounded-full pulse-dot"/>}
              {r.status === 'completed' && stream.done && <span className="w-1.5 h-1.5 bg-brand rounded-full"/>}
              {r.status === 'completed' && !stream.done && <span className="w-1.5 h-1.5 bg-brand rounded-full pulse-dot"/>}
              {r.status === 'failed' && <span className="w-1.5 h-1.5 bg-coral rounded-full"/>}
              {r.status === 'cancelled' && <span className="w-1.5 h-1.5 bg-smoke rounded-full"/>}
              {r.status === 'pending' && <span className="w-1.5 h-1.5 bg-smoke rounded-full"/>}
              <span className={cx(
                r.status === 'failed' ? 'text-coral'
                : r.status === 'cancelled' ? 'text-smoke'
                : r.status === 'completed' ? 'text-ash'
                : 'text-brand'
              )}>
                {(r.status === 'completed' && !stream.done) ? t('run.phaseStreaming') : phaseLabel}
              </span>
            </div>
          </div>
        </div>
        <TrustBadge score={p.trust}/>
      </div>

      {/* Body */}
      <div className="py-3 flex-1 min-h-[140px]">
        {r.status === 'pending' && (
          <div className="text-[12px] text-smoke">{t('run.phaseQueued')}…</div>
        )}
        {r.status === 'running' && (
          <div className="space-y-2">
            <div className="shimmer h-2.5 w-3/4"></div>
            <div className="shimmer h-2.5 w-5/6"></div>
            <div className="shimmer h-2.5 w-1/2"></div>
          </div>
        )}
        {r.status === 'cancelled' && (
          <div className="text-smoke text-[12px]">
            <I.x className="w-3.5 h-3.5 inline mr-1"/>
            {t('run.phaseCancelled')}
